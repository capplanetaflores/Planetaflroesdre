async function salvarLanc() {
  if (S.lf.modo === 'fixo' && !S.editId) return criarCustoFixo();
  if (S.lf.modo === 'parcelado' && !S.editId) return lancarParcelas();
  const row = {
    planilha_id: S.planilhaId,
    banco_id: Number(valCampo('e_banco')) || null,
    data_lancamento: valCampo('e_data'),
    plano_conta_id: Number(valCampo('e_plano')) || null,
    item: valCampo('e_item').trim(),
    valor: parseValor(valCampo('e_valor')),
    data_programada: valCampo('e_dprog') || null,
    data_pagamento: valCampo('e_dpag') || null,
  };
  if (!row.data_lancamento) return toast('Informe a data do lançamento.', true), $('e_data').focus();
  if (pagFuturo(row.data_pagamento)) return toast(MSG_PAG_FUTURO, true), $('e_dpag').focus();
  if (row.data_pagamento && !row.banco_id) return toast('Para marcar como pago/recebido, escolha também o banco.', true), abrirBsel($('e_banco'));
  if (!row.plano_conta_id) return toast('Selecione o plano de contas.', true), $('e_plano').focus();
  if (!(row.valor > 0)) return toast('Informe um valor maior que zero.', true), $('e_valor').focus();
  try {
    if (S.editId) {
      const orig = S.lancs.find(x => x.id === S.editId);
      if (!$('e_dprog')) delete row.data_programada;          // coluna oculta: não mexe no campo
      if (!$('e_item')) delete row.item;
      if (!$('e_dpag')) delete row.data_pagamento;
      if (!row.data_pagamento && orig.forma_pagamento) row.forma_pagamento = null;   // sem data de pagamento: volta a ficar em aberto
      await store.update('lancamentos', S.editId, comAjuste(orig, row));
    } else {
      if (!row.data_programada) row.data_programada = row.data_lancamento;   // vencimento padrão = data do lançamento
      await store.insert('lancamentos', row);
    }
  } catch (e) { return toast(e.message, true); }
  const [a, m] = row.data_lancamento.split('-').map(Number);
  const foraDoMes = a !== S.ano || m - 1 !== S.mes;
  toast(S.editId ? 'Lançamento ajustado.' : foraDoMes ? `Lançamento salvo em ${MESES_NOME[m - 1]}/${a}.` : row.data_pagamento ? 'Lançamento adicionado como ' + (sinal(row) > 0 ? 'recebido.' : 'pago.') : 'Lançado em aberto — pague/receba quando quiser.');
  const manter = { banco: row.banco_id ?? '', edit: S.editId };
  S.editId = null;
  await viewLancamentos();
  if (!manter.edit) {
    $('e_banco').value = manter.banco;
    $('e_data').value = HOJE;                      // volta sempre para o dia de hoje
    $('e_plano').focus({ preventScroll: true });
  } else focarLinha(manter.edit);
}

function editarLanc(id) {
  const l = S.lancs.find(x => x.id === id); if (!l) return;
  S.editId = id;
  if (S.lf.modo !== 'avulso') renderLancamentos();
  const put = (i, v) => { if ($(i)) $(i).value = v; };
  put('e_banco', l.banco_id ?? ''); put('e_data', l.data_lancamento); put('e_plano', l.plano_conta_id); put('e_item', l.item ?? '');
  put('e_valor', num2(l.valor)); put('e_dprog', l.data_programada ?? ''); put('e_dpag', l.data_pagamento ?? '');
  $('e_salvar').textContent = 'Salvar alteração'; $('e_cancelar').hidden = false;
  $('lf-tit').textContent = `Editando lançamento de ${fmtData(l.data_lancamento)}`;
  $('lancForm').classList.add('editando-f');
  atualizarBadgeEntrada(); renderLinhas();
  $('lancForm').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  $('e_valor').focus(); $('e_valor').select();
}

/* ---------- janela (modal) ---------- */
// aoFechar: chamado quando a pessoa fecha (✕, Cancelar, Esc, clique fora); não é chamado quando outra janela substitui esta.
// fixo: só fecha pelo botão (sem Esc e sem clique fora).
let MODAL_CB = null;
function abrirModal(html, cls = '', aoFechar = null, fixo = false) {
  fecharBsel(true); $('modal')?.remove();
  MODAL_CB = aoFechar;
  const w = document.createElement('div');
  w.className = 'modal-bg' + (fixo ? ' fixo' : ''); w.id = 'modal';
  w.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  if (!fixo) w.addEventListener('pointerdown', e => { if (e.target === w) fecharModal(); });

async function confirmarPagamento() {

    const pagoRow = p => ({ banco_id: p.banco, forma_pagamento: p.forma, data_pagamento: data, data_lancamento: dataLanc, data_programada: venc, valor: r2(p.valor) });

    };
    try {

      } else {                                               // fecha o valor: o original fica com a 1ª forma, as outras viram lançamentos novos

      }

  }

    if ($('p_valor')) $('p_valor').value = num2(tot);

      bom_para: c.bom_para || data, recebido_em: data, valor: r2(c.valor), status: 'carteira', lanc_id: lid, origem_desc: l.item || M.plano[l.plano_conta_id]?.nome || '' });

async function estornarPagamento() {

const somaMeses = (iso, n) => { const [a, m, d] = iso.split('-').map(Number), p = new Date(a, m - 1 + n, 1); return isoData(new Date(p.getFullYear(), p.getMonth(), Math.min(d, ultimoDia(p.getFullYear(), p.getMonth())))); };
function gerarParcelas() {
  const np = Math.max(0, Math.min(360, parseInt(valCampo('e_np'), 10) || 0)), d0 = valCampo('e_data');
  const v = parseValor(valCampo('e_valor'));
  S.lf.np = np;
  if (np < 2 || !d0 || !(v > 0)) { S.lf.parc = null; return desenharParcelas(); }
  let valores;
  if (S.lf.base === 'total') {
    const base = Math.floor(v / np * 100) / 100;
    valores = Array.from({ length: np }, (_, i) => i === np - 1 ? r2(v - base * (np - 1)) : base);   // a diferença dos centavos fica na última
  } else valores = Array(np).fill(v);
  S.lf.parc = valores.map((valor, i) => ({ data: somaMeses(d0, i), valor }));
  desenharParcelas();
}

  const tot = P.reduce((a, p) => a + p.valor, 0);

      <span class="parc-tot">Total <b>${brl(tot)}</b></span></div>
    <div class="parc-grid">${P.map((p, i) => `<div class="parc ${p.ed ? 'ed' : ''}">
      <div class="pn"><b>${i + 1}</b>/${P.length}</div>
      <input type="date" value="${p.data}" data-pi="${i}" data-pk="data">
      <input inputmode="decimal" value="${num2(p.valor)}" data-pi="${i}" data-pk="valor">
    </div>`).join('')}</div>
    <div class="parc-f"><span class="mut">Cada parcela entra nos lançamentos, no fluxo de caixa e na DRE <b>no mês do seu vencimento</b> (não tudo na competência da compra), em aberto, e é paga depois pelo botão <b>Pagar</b> (continua no vencimento).</span>
      <button class="salvar" data-act="lancarParcelas">+ Lançar ${P.length} parcelas · ${brl(tot)}</button></div>`;

/* ===================== PAGAMENTOS PARCIAIS ===================== */
// Um pagamento parcial vira um lançamento pago ligado ao original (origem "PGP:<id do original>"), assim ele entra
// no banco, no fluxo e na DRE na data certa. O original fica em aberto só com o restante e mostra o fluxo de pagamentos.
// Quando o restante é pago, o próprio original vira o último pagamento (quitação) e sai da tela "Pagos Parcialmente".
function mapaParciais(filhos) {
  const m = {};
  for (const f of filhos || []) { const id = Number(String(f.origem).slice(4)); if (id) (m[id] ||= []).push(f); }
  return m;
}
const paiParcial = l => !l ? null : String(l.origem || '').startsWith('PGP:') ? Number(l.origem.slice(4)) : S.pgp?.[l.id]?.length ? l.id : null;

let FPP = null;     // { pai, filhos, depois }
async function abrirFluxoParcial(paiId, depois) {
  if (!paiId) return;
  let pai, filhos;
  try { [[pai], filhos] = await Promise.all([store.lancsIds([paiId]), store.lancsOrigem(`PGP:${paiId}`)]); }
  catch (e) { return toast(e.message, true); }
  if (!pai) return toast('Lançamento original não encontrado.', true);
  FPP = { pai, filhos: filhos.sort((a, b) => (a.data_pagamento || '').localeCompare(b.data_pagamento || '') || a.id - b.id), depois: depois || FPP?.depois };
  desenharFluxoParcial();
}
function totaisParcial(pai, filhos) {
  const quitado = !emAberto(pai), pagoF = filhos.reduce((a, f) => a + Number(f.valor), 0);
  const total = r2(pagoF + Number(pai.valor)), pago = r2(pagoF + (quitado ? Number(pai.valor) : 0));
  return { quitado, total, pago, resta: r2(total - pago) };
}

  let acum = 0;
  abrirModal(`
    <div class="mh ${rec ? 'rec' : 'desp'}" style="--ec:${esc(corEmpresa(pai.planilha_id))}">

      <div><span>Vencimento</span><b>${fmtData(vencimento(pai))}</b>${pai.parcela ? `<em class="mut">parcela ${esc(pai.parcela)}</em>` : ''}</div>

      <div class="pg"><span>${T.quitado ? '✓ Quitado' : 'Andamento'}</span><div class="fpp-bar"><i style="width:${T.total ? Math.min(100, T.pago / T.total * 100) : 0}%"></i></div><small>${T.total ? Math.round(T.pago / T.total * 100) : 0}% ${rec ? 'recebido' : 'pago'}</small></div>
    </div>
    <div class="ls-tab"><table class="ls"><thead><tr><th>#</th><th>Data ${rec ? 'receb.' : 'pagto.'}</th><th>Banco</th><th>Forma</th><th style="text-align:right">Valor</th><th style="text-align:right">Acumulado</th><th></th></tr></thead><tbody>
      ${linhas.map((x, i) => { acum += Number(x.valor); return `<tr class="${rec ? 'rec' : 'desp'}">
        <td class="c"><b>${i + 1}</b>${x._q ? ' <small class="mut">quitação</small>' : ''}</td>

}
const voltarFluxo = () => abrirFluxoParcial(FPP?.pai.id);

async function fppSalvar(id) {
  const f = FPP.filhos.find(x => x.id === id), { pai } = FPP; if (!f) return;
  const data = $('fe_data').value, banco = Number($('fe_banco').value) || null, forma = $('fe_forma').value;

  if (emAberto(pai) && restaNovo < 0.005) return toast(`Esse valor quita ou passa do total. Para quitar, use "+ Registrar pagamento" com o restante (${brl(Number(pai.valor) + Number(f.valor))} no máximo).`, true);

async function fppExcluir(id) {

// Cartões ficam em "parametros" (chave cartoes_credito). Cada compra vira um lançamento por parcela, em aberto,
// com data do lançamento = vencimento da fatura em que a parcela cai (entra na DRE e no fluxo pelo vencimento).
// Origem dos lançamentos: "CC:<id do cartão>:<data da compra AAAAMMDD><código da compra>".
const CC_CHAVE = 'cartoes_credito';
const BANDEIRAS = ['Visa', 'Mastercard', 'Elo', 'American Express', 'Hipercard', 'Outra'];
const ccDaOrigem = o => { const m = /^CC:([^:]+):(\d{8})(.*)$/.exec(o || ''); return m ? { cartao: m[1], data: `${m[2].slice(0, 4)}-${m[2].slice(4, 6)}-${m[2].slice(6, 8)}`, compra: m[2] + m[3] } : null; };
const cartaoDe = id => S.cc.lista.find(c => c.id === id);
// vencimento da fatura em que cai uma compra (parcela 0) feita na data "iso"
function vencFatura(cc, iso, i = 0) {
  const [a, m, d] = iso.split('-').map(Number);
  let fm = m - 1 + (d >= Number(cc.fechamento) ? 1 : 0);          // compra no dia do fechamento ou depois: próxima fatura
  if (Number(cc.vencimento) <= Number(cc.fechamento)) fm += 1;      // vence no mês seguinte ao fechamento
  fm += i;
  const x = new Date(a, fm, 1);
  return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(Math.min(Number(cc.vencimento), ultimoDia(x.getFullYear(), x.getMonth())))}`;
}

  let v = null;
  try { v = await store.getParam(CC_CHAVE); } catch (e) { toast(e.message, true); }
  S.cc.lista = Array.isArray(v) ? v : [];
}

function ccLerCompra() {
  const c = cartaoDe($('cc_cartao')?.value), data = $('cc_data')?.value, v = parseValor($('cc_valor')?.value || ''), n = Math.max(1, Math.min(48, parseInt($('cc_np')?.value, 10) || 1));
  if (!c || !data || !(v > 0)) return null;
  const base = Math.floor(v / n * 100) / 100;
  return { c, data, v, n, parc: Array.from({ length: n }, (_, i) => ({ venc: vencFatura(c, data, i), valor: i === n - 1 ? r2(v - base * (n - 1)) : base })) };

const chaveMetas = (ano = S.ano) => `metas_raiox:${S.empresaVis}:${ano}`;
const TEMAS_META = () => [...TEMAS_D.map(([k]) => 'd:' + k), 'd:outros'];
async function lerMetasAno(ano) {

  try { v = await store.getParam(chaveMetas(ano)); } catch (e) { console.warn(e); }

  let ant = null;                                   // versão anterior: um valor mensal único por tema

async function carregarMetas() { S.metas = await lerMetasAno(S.ano); S.metasAno = S.ano; }
const somaMeta = (arr, a = 0, b = 11) => { let t = 0; for (let m = a; m <= b; m++) t += Number(arr?.[m]) || 0; return r2(t); };
// linha de meta dentro do cartão do Raio-X
function metaRx(id, real, P) {

    <div class="rx-mh"><span>Meta <b>${brl(meta)}</b></span><span class="st">${st === 'cr' ? `✕ passou ${valorCurto(real - meta)}` : st === 'at' ? '! perto do teto' : '✓ dentro'} · ${pct(q)}</span></div>
    <div class="rx-mbar"><i style="width:${Math.min(100, q * 100)}%"></i><em style="left:${Math.min(100, 100 / Math.max(1, q))}%"></em></div></div>`;
}

function desenharMetas() {
  const corpo = $('mt_corpo'); if (!corpo) return;
  const D = S.metasEd.dados, temas = TEMAS_META(), v = x => Number(x) > 0 ? num2(x) : '';
  corpo.innerHTML = temas.map(t => `<tr class="${t === S.metasEd.foco ? 'foco' : ''}"><td class="l">${temaIc(t, 'tema-ic sm')}<span>${esc(TEMA_INFO[t].n)}</span></td>
    ${MESES.map((_, m) => `<td><input inputmode="decimal" data-mm="${t}|${m}" value="${v(D[t]?.[m])}" placeholder="—"></td>`).join('')}
    <td class="tot"><input inputmode="decimal" data-mt="${t}" value="${v(somaMeta(D[t]))}" placeholder="—"></td></tr>`).join('');

}
function desenharPeMetas() {
  const D = S.metasEd.dados, pe = $('mt_pe'); if (!pe) return;

}
const dividir = (v, n) => { const b = Math.floor(v / n * 100) / 100; return Array.from({ length: n }, (_, i) => i === n - 1 ? r2(v - b * (n - 1)) : b); };
function metasBloco() {
  const tema = $('mb_tema').value, v = parseValor($('mb_valor').value) || 0, modo = $('mb_modo').value;
  let de = Number($('mb_de').value), ate = Number($('mb_ate').value);
  if (de > ate) [de, ate] = [ate, de];
  if (!(v >= 0)) return toast('Informe o valor.', true);
  const vals = modo === 'total' ? dividir(v, ate - de + 1) : Array(ate - de + 1).fill(v);
  for (const t of tema === '*' ? TEMAS_META() : [tema]) {
    const arr = (S.metasEd.dados[t] ||= Array(12).fill(0));
    for (let m = de; m <= ate; m++) arr[m] = vals[m - de];
  }
  S.metasEd.mudou = true; desenharMetas();
  toast(`Aplicado: ${tema === '*' ? 'todos os temas' : TEMA_INFO[tema].n} · ${MESES[de]} a ${MESES[ate]}`);

async function salvarMetas() {
  const m = {};
  for (const [k, arr] of Object.entries(S.metasEd.dados)) if (somaMeta(arr) > 0) m[k] = arr.map(x => r2(Number(x) || 0));
  try { await store.setParam(chaveMetas(S.metasEd.ano), m); } catch (e) { return toast(e.message, true); }

}

/* ============================ CHEQUES ============================ */
// Cheques de TERCEIROS (recebidos) ficam em "parametros" (chave cheques) e o dinheiro deles fica numa conta-banco própria
// ("CHEQUES EM CARTEIRA", criada automaticamente, ligada à empresa em parametros chave cheques_conta).
// Situação: carteira (em aberto) → depositado (transferência para um banco) ou repassado (usado para pagar uma conta).
// Cheques PRÓPRIOS (tipo 'proprio', emitidos pela empresa): a conta é paga na data efetiva do pagamento saindo da conta de controle
// "CHEQUES EMITIDOS A COMPENSAR" (parametros chave cheques_conta_emit). Na baixa da compensação, uma transferência
// banco do cheque → CHEQUES EMITIDOS A COMPENSAR, na data da compensação, debita o banco de verdade. Situação: emitido → compensado.
// baixa_ref: "T:<id da transferência>" ou "L:<id do lançamento pago>". lanc_id: lançamento do recebimento/pagamento.
// mov:false = cheque próprio de cadastro manual (só acompanhamento: a compensação não movimenta banco).
const CHQ_CHAVE = 'cheques', CHQ_CONTA = 'cheques_conta', CHQ_EMIT = 'cheques_conta_emit';
const FORMAS_CHQ = ['Cheque', 'Cheque pré-datado'];
async function carregarCheques() {
  try {
    const [l, c, e] = await Promise.all([store.getParam(CHQ_CHAVE), store.getParam(CHQ_CONTA), store.getParam(CHQ_EMIT)]);
    S.chq.lista = Array.isArray(l) ? l : []; S.chq.conta = c && typeof c === 'object' ? c : {}; S.chq.contaEmit = e && typeof e === 'object' ? e : {};
  } catch (e) { console.warn('cheques', e); }
}
const gravarCheques = () => store.setParam(CHQ_CHAVE, S.chq.lista);
const ehProprio = c => c?.tipo === 'proprio';
const contaCheque = pid => { const id = S.chq.conta?.[pid]; return id && M.banco[id] ? Number(id) : null; };
const contaEmitidos = pid => { const id = S.chq.contaEmit?.[pid]; return id && M.banco[id] ? Number(id) : null; };
const ehContaCheque = bid => !!bid && Object.values(S.chq.conta || {}).map(Number).includes(Number(bid));
const ehContaEmitidos = bid => !!bid && Object.values(S.chq.contaEmit || {}).map(Number).includes(Number(bid));
// bancos "de verdade" da empresa (sem as contas de controle de cheques): de onde sai o cheque próprio
const bancosParaCheque = pid => bancosDaEmpresa(pid).filter(b => !ehContaCheque(b.id) && !ehContaEmitidos(b.id) && !/CHEQUE/.test(normTxt(b.nome)));
const chqCarteira = pid => S.chq.lista.filter(c => !ehProprio(c) && c.status === 'carteira' && c.planilha_id === pid).sort((a, b) => (a.bom_para || '').localeCompare(b.bom_para || ''));
const chqEmitidos = pid => S.chq.lista.filter(c => ehProprio(c) && c.status === 'emitido' && c.planilha_id === pid)
  .sort((a, b) => (a.bom_para || '').localeCompare(b.bom_para || '') || String(a.numero).localeCompare(String(b.numero), 'pt-BR', { numeric: true }));
const novoIdChq = () => 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const proxNumChq = n => { const m = String(n || '').match(/^(.*?)(\d+)$/); return m ? m[1] + String(Number(m[2]) + 1).padStart(m[2].length, '0') : ''; };
const diasAte = d => Math.round((new Date((d || HOJE) + 'T12:00') - new Date(HOJE + 'T12:00')) / 864e5);
async function criarContaControle(pid, base) {
  let nome = base;
  if (S.bancos.some(x => normTxt(x.nome) === normTxt(nome))) nome += ' ' + siglaEmpresa(pid);
  const b = await store.insert('bancos', { nome, saldo_inicial: 0, logo: null, planilha_id: pid });
  await recarregarCadastros();
  toast(`Conta "${nome}" criada para controlar os cheques.`);
  return b;
}
async function garantirContaCheque(pid) {
  if (contaCheque(pid)) return contaCheque(pid);
  const b = S.bancos.find(x => x.planilha_id === pid && /CHEQUE/.test(normTxt(x.nome)) && !/EMITID|COMPENS|PROPRI/.test(normTxt(x.nome)) && !ehContaEmitidos(x.id))
    || await criarContaControle(pid, 'CHEQUES EM CARTEIRA');
  S.chq.conta = { ...(S.chq.conta || {}), [pid]: b.id };
  await store.setParam(CHQ_CONTA, S.chq.conta);
  return b.id;
}
async function garantirContaEmitidos(pid) {
  if (contaEmitidos(pid)) return contaEmitidos(pid);
  const b = S.bancos.find(x => x.planilha_id === pid && /CHEQUE/.test(normTxt(x.nome)) && /EMITID|COMPENS/.test(normTxt(x.nome)) && !ehContaCheque(x.id))
    || await criarContaControle(pid, 'CHEQUES EMITIDOS A COMPENSAR');
  S.chq.contaEmit = { ...(S.chq.contaEmit || {}), [pid]: b.id };
  await store.setParam(CHQ_EMIT, S.chq.contaEmit);
  return b.id;
}
// volta para a carteira / para "a compensar" os cheques baixados por uma transferência/pagamento desfeito
async function chequesVoltar(ref) {
  await carregarCheques();
  let t = 0, p = 0;
  for (const c of S.chq.lista) if (c.baixa_ref === ref) { if (ehProprio(c)) { c.status = 'emitido'; p++; } else { c.status = 'carteira'; t++; } c.baixa_ref = c.baixa_data = c.baixa_desc = null; }
  if (t || p) { await gravarCheques(); toast([t ? `${t} cheque(s) voltaram para a carteira` : '', p ? `${p} cheque(s) próprio(s) voltaram para "a compensar"` : ''].filter(Boolean).join(' · ') + '.'); }
}
// antes de desfazer/excluir um lançamento: devolve cheques repassados e remove os recebidos/emitidos por ele
async function chequesAoDesfazerLanc(id) {
  await carregarCheques();
  const doLanc = S.chq.lista.filter(c => c.lanc_id === id);
  if (doLanc.some(c => c.status !== (ehProprio(c) ? 'emitido' : 'carteira'))) {
    toast('Este lançamento tem cheque(s) já depositado(s), repassado(s) ou compensado(s). Desfaça antes o depósito, o pagamento ou a compensação desses cheques (tela Cheques).', true);
    return false;
  }
  if (doLanc.length) { S.chq.lista = S.chq.lista.filter(c => c.lanc_id !== id); await gravarCheques(); }
  await chequesVoltar(`L:${id}`);
  return true;
}

function pagChqLer() {

function pagChqTotal() {

}

/* ============================ CUSTOS FIXOS ============================ */
// Cada custo fixo tem uma ou mais vigências (início, fim e valor). Para cada mês de vigência existe um
// lançamento em aberto (origem "CF:id"). Ao mudar as vigências, os lançamentos em aberto são recriados,
// alterados ou removidos; os já pagos e os ajustados à mão nunca são mexidos.
// Os custos fixos ficam salvos em "parametros" (chave custos_fixos).
const CF_CHAVE = 'custos_fixos';
const proxMes = ym => { const [a, m] = ym.split('-').map(Number); return m === 12 ? `${a + 1}-01` : `${a}-${pad(m + 1)}`; };
const antMes = ym => { const [a, m] = ym.split('-').map(Number); return m === 1 ? `${a - 1}-12` : `${a}-${pad(m - 1)}`; };
const fmtMes = ym => ym ? `${MESES[Number(ym.slice(5, 7)) - 1]}/${ym.slice(0, 4)}` : '';
const MES_ATUAL = HOJE.slice(0, 7);
const horizonteCF = () => `${hoje.getFullYear() + 1}-12`;      // vigência sem fim: gera até dezembro do ano que vem
const dataCF = (cf, ym) => { const [a, m] = ym.split('-').map(Number); return `${ym}-${pad(Math.min(cf.dia, ultimoDia(a, m - 1)))}`; };
const vigOrdenadas = cf => [...(cf.vigencias || [])].sort((a, b) => a.inicio.localeCompare(b.inicio));
const vigDoMes = (cf, ym) => vigOrdenadas(cf).filter(v => v.inicio <= ym && (!v.fim || v.fim >= ym)).at(-1) || null;
const fimCF = cf => { const v = vigOrdenadas(cf); return v.some(x => !x.fim) ? null : v.reduce((a, x) => x.fim > a ? x.fim : a, ''); };
const iniCF = cf => vigOrdenadas(cf)[0]?.inicio || '';
const statusCF = cf => cf.ativo === false ? 'encerrado' : iniCF(cf) > MES_ATUAL ? 'futuro' : (fimCF(cf) && fimCF(cf) < MES_ATUAL) ? 'encerrado' : 'ativo';
const valorAtualCF = cf => (vigDoMes(cf, MES_ATUAL) || (statusCF(cf) === 'futuro' ? vigOrdenadas(cf)[0] : vigOrdenadas(cf).at(-1)))?.valor ?? 0;

async function carregarCF() {
  let v = null;
  try { v = await store.getParam(CF_CHAVE); } catch (e) { toast(e.message, true); }
  S.cf.lista = Array.isArray(v) ? v : [];
  return S.cf.lista;
}
const gravarCF = () => store.setParam(CF_CHAVE, S.cf.lista);

function mesesDesejados(cf) {
  const out = new Map();
  if (cf.ativo === false) return out;
  for (const v of vigOrdenadas(cf)) {
    const fim = v.fim || horizonteCF();
    for (let ym = v.inicio; ym <= fim; ym = proxMes(ym)) out.set(ym, Number(v.valor));
  }
  return out;
}
async function sincronizarCF(cf) {
  const desej = mesesDesejados(cf), exist = await store.lancsOrigem(`CF:${cf.id}`);
  const porMes = new Map(); let alterados = 0, removidos = 0;
  for (const l of exist) {
    const ym = vencimento(l).slice(0, 7);
    if (!emAberto(l) || (l.ajustes && Object.keys(l.ajustes).length)) { porMes.set(ym, l); continue; }   // pago ou ajustado à mão: fica como está
    if (!desej.has(ym) || porMes.has(ym)) { await store.remove('lancamentos', l.id); removidos++; continue; }
    porMes.set(ym, l);
    const alvo = { planilha_id: cf.planilha_id, plano_conta_id: cf.plano_conta_id, item: cf.descricao, valor: desej.get(ym), data_lancamento: dataCF(cf, ym), data_programada: dataCF(cf, ym) };
    if (Object.keys(alvo).some(k => !mesmoValor(l[k], alvo[k]))) { await store.update('lancamentos', l.id, alvo); alterados++; }
  }
  const novos = [...desej].filter(([ym]) => !porMes.has(ym)).map(([ym, valor]) => ({
    planilha_id: cf.planilha_id, banco_id: null, plano_conta_id: cf.plano_conta_id, item: cf.descricao, valor,
    data_lancamento: dataCF(cf, ym), data_programada: dataCF(cf, ym), origem: `CF:${cf.id}` }));
  if (novos.length) await store.insertMany('lancamentos', novos);
  cf.gerado_ate = fimCF(cf) || horizonteCF();
  return { criados: novos.length, alterados, removidos };
}
// ao entrar no sistema: estende os custos fixos sem fim até o horizonte (ex.: virou o ano)
async function renovarCustosFixos() {
  try {
    await carregarCF();
    const pend = S.cf.lista.filter(cf => cf.ativo !== false && !fimCF(cf) && (cf.gerado_ate || '') < horizonteCF());
    for (const cf of pend) await sincronizarCF(cf);
    if (pend.length) await gravarCF();
  } catch (e) { console.warn('custos fixos', e); }
}
const resumoSinc = r => [r.criados && `${r.criados} criado(s)`, r.alterados && `${r.alterados} alterado(s)`, r.removidos && `${r.removidos} removido(s)`].filter(Boolean).join(', ') || 'nada a mudar';

function validarCF(cf) {
  if (!cf.planilha_id) return 'Escolha a empresa.';
  if (!cf.plano_conta_id) return 'Selecione o plano de contas.';
  if (!(cf.dia >= 1 && cf.dia <= 31)) return 'Dia do vencimento entre 1 e 31.';
  const v = vigOrdenadas(cf);
  if (!v.length) return 'Inclua pelo menos uma vigência.';
  for (const [i, x] of v.entries()) {
    if (!x.inicio) return `Vigência ${i + 1}: informe o início.`;
    if (x.fim && x.fim < x.inicio) return `Vigência ${i + 1}: o fim é antes do início.`;
    if (!(Number(x.valor) > 0)) return `Vigência ${i + 1}: informe um valor maior que zero.`;
    if (i < v.length - 1 && (!x.fim || x.fim >= v[i + 1].inicio)) return `As vigências ${fmtMes(x.inicio)} e ${fmtMes(v[i + 1].inicio)} se sobrepõem: termine a anterior antes do início da seguinte.`;
  }
  return null;
}
async function salvarCF(cf, novo) {
  const erro = validarCF(cf); if (erro) { toast(erro, true); return false; }
  cf.vigencias = vigOrdenadas(cf).map(v => ({ ...v, valor: r2(Number(v.valor)) }));
  await carregarCF();
  const i = S.cf.lista.findIndex(x => x.id === cf.id);
  if (i >= 0) S.cf.lista[i] = cf; else S.cf.lista.push(cf);
  try {
    const r = await sincronizarCF(cf);
    await gravarCF();
    toast(`${novo ? 'Custo fixo criado' : 'Vigências salvas'} · lançamentos: ${resumoSinc(r)}.`);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

/* ========================= FLUXO DE CAIXA DIÁRIO ========================= */
async function viewFluxo() {
  const { ini, fim } = periodoMes();
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  // fluxo de caixa realizado: só o que foi pago/recebido, no dia do pagamento (em aberto não entra)
  let lancs = [], saldo0 = 0;
  try {
    const todos = (await store.lancs({ planilha_id: pid })).filter(l => l.data_pagamento);
    saldo0 = S.planilhas.filter(p => pid == null || p.id === pid).reduce((a, p) => a + (Number(p.saldo_inicial) || 0), 0);
    for (const l of todos) if (l.data_pagamento < ini) saldo0 += sinal(l) * Number(l.valor);
    saldo0 = r2(saldo0);
    lancs = todos.filter(l => l.data_pagamento >= ini && l.data_pagamento <= fim);
  } catch (e) { toast(e.message, true); }
  const nd = ultimoDia(S.ano, S.mes);
  const dias = Array.from({ length: nd }, (_, i) => ({ dia: i + 1, data: `${S.ano}-${pad(S.mes + 1)}-${pad(i + 1)}`, ent: 0, sai: 0, itens: [] }));
  for (const l of lancs) {
    const d = dias[Number(l.data_pagamento.slice(8, 10)) - 1]; if (!d) continue;
    const v = Number(l.valor);
    if (sinal(l) > 0) d.ent += v; else d.sai += v;
    d.itens.push(l);
  }
  let s = saldo0, menor = { v: Infinity, d: null };
  for (const d of dias) {
    d.ini = s; s = r2(s + d.ent - d.sai); d.fim = s;
    if (d.fim < menor.v) menor = { v: d.fim, d: d.dia };
  }
  S.fluxoDados = { dias, saldo0, saldoFim: s, menor, tEnt: dias.reduce((a, d) => a + d.ent, 0), tSai: dias.reduce((a, d) => a + d.sai, 0) };
  renderFluxo();
}

  const cfg = cfgTela('fluxo');
  let vis = S.fluxo.ocultarVazios ? dias.filter(d => d.itens.length) : dias;

  const pe = { ini: num2(saldo0), ent: num2(tEnt), sai: num2(tSai), res: num2(tEnt - tSai), fim: num2(s), qtd: dias.reduce((a, d) => a + d.itens.length, 0) };

  $('main').innerHTML = `

    <div class="barra">${abasEmpresa(S.empresaVis, 'empresaVis', false, 'FLUXO DE CAIXA', 'FLUXO DE CAIXA ACUMULADO')}</div>
    <div class="barra">${barraAno()}${barraMeses(corEmpresa(S.empresaVis))}
      <div class="filtros"><label class="chk"><input type="checkbox" data-chg="fluxoVazios" ${S.fluxo.ocultarVazios ? 'checked' : ''}> Ocultar dias sem movimento</label>${botaoPers('fluxo')}${botoesPDF()}</div>
    </div>
    <div class="tabwrap congela"><table class="fluxo zebra ${cfg.compacto ? 'compacto' : ''}">
      <thead><tr><th style="text-align:left">Dia</th>${cfg.cols.map(k => `<th>${colDef('fluxo', k).h}</th>`).join('')}</tr></thead>
      <tbody>${vis.map(d => {
        const dow = new Date(S.ano, S.mes, d.dia).getDay(), aberto = S.fluxo.abertos.has(d.data);
        const cls = [dow === 0 || dow === 6 ? 'fds' : '', d.data === HOJE ? 'hoje' : '', d.itens.length ? '' : 'sem'].join(' ');
        let html = `<tr class="${cls}"><td class="dia" data-act="fluxoDia" data-d="${d.data}"><span class="caret ${aberto ? 'on' : ''}">${d.itens.length ? '▸' : ''}</span>${pad(d.dia)}/${pad(S.mes + 1)} <span class="mut">${DIAS_SEM[dow]}</span></td>${cfg.cols.map(k => cel(k, d)).join('')}</tr>`;
        if (aberto) html += d.itens.map(l => `<tr class="det"><td>${consolidado ? `<span class="tag tag-emp">${esc((M.planilha[l.planilha_id]?.nome ?? '').replace('LANÇAMENTOS ', ''))}</span>` : ''}</td>
          <td colspan="${cfg.cols.length}"><div class="detl"><span class="b">${l.banco_id ? bancoTag(M.banco[l.banco_id], 16) : `<span class="a-def">${sinal(l) > 0 ? 'a receber' : 'a pagar'}</span>`}</span><span class="c">${esc(planoLabel(l.plano_conta_id))} <span class="mut">· ${esc(l.item)}</span></span><b class="${sinal(l) > 0 ? 'pos' : 'neg'}">${sinal(l) > 0 ? '' : '-'}${num2(l.valor)}</b></div></td></tr>`).join('');
        return html;
      }).join('') || `<tr><td colspan="${cfg.cols.length + 1}" class="vazio">Sem movimento no mês.</td></tr>`}</tbody>
      <tfoot><tr><td style="text-align:left">Total do mês</td>${cfg.cols.map(k => `<td class="r ${peCls[k] ?? ''} ${['ent', 'sai', 'res', 'qtd'].includes(k) ? 'clk" data-act="fxCel" data-k="' + k : ''}">${pe[k]}</td>`).join('')}</tr></tfoot>

/* ================================ DRE ================================ */
async function viewDRE() {
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  let lancs = [];
  try { lancs = await store.lancs({ ini: `${S.ano}-01-01`, fim: `${S.ano}-12-31`, planilha_id: pid }); }
  catch (e) { toast(e.message, true); }
  const z = () => Array(12).fill(0);
  const pos = Object.fromEntries(DRE_POS.map(([k]) => [k, z()]));
  const conta = {}, semDre = z(), contasSem = new Set(), comDados = new Set();
  for (const l of lancs) {
    const m = Number(l.data_lancamento.slice(5, 7)) - 1, v = sinal(l) * Number(l.valor);
    const pc = M.plano[l.plano_conta_id], gd = M.gdre[pc?.grupo_dre_id];
    comDados.add(m);
    (conta[l.plano_conta_id] ||= z())[m] += v;
    if (gd) pos[gd.posicao][m] += v;
    else { semDre[m] += v; contasSem.add(l.plano_conta_id); }
  }
  S.dre.dados = { pos, conta, semDre, contasSem, comDados };
  renderDRE();
}

// meses ocultos na DRE (vale para KF, DK e Consolidado)
const mesesOcultosDRE = () => new Set(VIS.dre?.ocultos || []);
function setMesesOcultosDRE(set) {
  if (set.size >= 12) return toast('Deixe pelo menos um mês visível.', true);
  VIS.dre = { ...(VIS.dre || {}), ocultos: [...set].sort((a, b) => a - b) }; salvarVis(); renderDRE();

function renderDRE() {
  const { pos, conta, semDre, contasSem, comDados } = S.dre.dados;
  const cfg = cfgTela('dre'), oc = mesesOcultosDRE();
  let meses = [...Array(12).keys()].filter(m => !oc.has(m));
  if (cfg.desc) meses.reverse();
  const soma = arr => meses.reduce((a, m) => a + (arr?.[m] || 0), 0);
  const cols = Array.from({ length: 12 }, (_, m) => calcularLinhas(Object.fromEntries(DRE_POS.map(([k]) => [k, pos[k][m]]))));
  const tot = calcularLinhas(Object.fromEntries(DRE_POS.map(([k]) => [k, soma(pos[k])])));   // total só dos meses exibidos
  const n = meses.filter(m => comDados.has(m)).length;
  const rob = tot.ROB;
  const fmt = v => Math.abs(v) < 0.005 ? '<span class="z">–</span>' : `<span class="${v < 0 ? 'neg' : 'pos'}">${num2(v)}</span>`;   // positivo verde, negativo vermelho
  const f2 = v => Number.isFinite(v) ? num2(v) : '–';
  const head = `<tr><th style="text-align:left">Demonstrativo de Resultados</th>${meses.map(m => `<th>${MESES[m]}</th>`).join('')}${cfg.cols.map(k => `<th>${k === 'total' && oc.size ? `ACUMULADO (${meses.length} ${meses.length === 1 ? 'mês' : 'meses'})` : colDef('dre', k).h.toUpperCase()}</th>`).join('')}</tr>`;
  const ck = (at, m, v) => at && Math.abs(v || 0) > 0.004 ? ` class="clk" ${at} data-m="${m}" title="Ver os lançamentos"` : '';
  const linhaVals = (arr, total, at = '') => meses.map(m => `<td${ck(at, m, arr[m])}>${fmt(arr[m])}</td>`).join('') + cfg.cols.map(k => ({
    total: `<td class="tot${at && Math.abs(total) > 0.004 ? ' clk' : ''}" ${at && Math.abs(total) > 0.004 ? `${at} data-m="tot" title="Ver os lançamentos"` : ''}>${fmt(total)}</td>`,
    media: `<td>${fmt(n ? total / n : 0)}</td>`,
    av: `<td class="mut">${rob ? pct(total / rob) : '–'}</td>`,
  })[k]).join('');
  const linhaPct = k => meses.map(m => `<td>${cols[m].ROB ? pct(cols[m][k] / cols[m].ROB) : '–'}</td>`).join('') + cfg.cols.map(c => ({
    total: `<td class="tot">${rob ? pct(tot[k] / rob) : '–'}</td>`, media: '<td>–</td>', av: '<td></td>',
  })[c]).join('');
  const calcNome = k => Object.values(DRE_CALC).find(x => x[0] === k);
  let body = '';
  for (const [t, k, rot] of DRE_LINHAS) {
    if (t === 'g') {
      const aberto = S.dre.abertos.has(k);
      const contasPos = S.plano_contas.filter(p => M.gdre[p.grupo_dre_id]?.posicao === k && meses.some(m => Math.abs(conta[p.id]?.[m] || 0) > 0.004));
      body += `<tr class="g"><td class="l" data-act="dreAbrir" data-k="${k}"><span class="caret ${aberto ? 'on' : ''}">${contasPos.length ? '▸' : ''}</span>${esc(POS_NOME[k])}</td>${linhaVals(cols.map(c => c[k]), tot[k], `data-act="dreCel" data-k="${k}"`)}</tr>`;
      if (aberto) body += contasPos.map(p => `<tr class="sub"><td class="l">${esc(p.codigo + ' ' + p.nome)}</td>${linhaVals(conta[p.id], soma(conta[p.id]), `data-act="dreCel" data-c="${p.id}"`)}</tr>`).join('');
    } else if (t === 's') {
      body += `<tr class="s"><td class="l" title="${esc(calcNome(k)?.[2] ?? '')}">${esc(calcNome(k)?.[1] ?? k)}</td>${linhaVals(cols.map(c => c[k]), tot[k])}</tr>`;
    } else if (t === 'p') {
      if (S.dre.pct) body += `<tr class="p"><td class="l">${esc(rot)}</td>${linhaPct(k)}</tr>`;
    } else if (t === 'pe') {
      body += `<tr class="pe"><td class="l" title="Despesas ADM ÷ Margem de Contribuição %">${esc(rot)}</td>${meses.map(m => `<td>${f2(cols[m].PE)}</td>`).join('')}${cfg.cols.map(c => ({
        total: `<td>${f2(tot.PE)}</td>`, media: `<td>${n ? f2(tot.PE / n) : '–'}</td>`, av: '<td></td>' })[c]).join('')}</tr>`;
    }
  }
  if (contasSem.size && meses.some(m => Math.abs(semDre[m]) > 0.004)) body += `<tr class="alerta"><td class="l">⚠ Contas sem Grupo DRE (${contasSem.size}) — <a href="#" data-act="cadTab" data-t="grupos_dre">classificar</a></td>${linhaVals(semDre, soma(semDre), 'data-act="dreCel" data-k="SEM"')}</tr>`;

  const periodo = oc.size ? `${meses.length} ${meses.length === 1 ? 'mês selecionado' : 'meses selecionados'}` : 'ano todo';
  $('main').innerHTML = `
    ${bannerEmpresa(S.empresaVis, 'DRE')}
    <h2 class="tit">DRE — Demonstrativo de Resultados</h2>
    <p class="sub">${S.ano} · ${periodo}. Percentuais sobre a Receita Operacional Bruta. Clique em um grupo para ver as contas, ou em um valor para ver os lançamentos.</p>
    <div class="barra">${abasEmpresa(S.empresaVis, 'empresaVis', false, 'DRE')}</div>
    <div class="barra">${barraAno()}
      <div class="filtros">
        <div class="seg"><button class="${S.dre.pct ? 'on' : ''}" data-act="drePct" data-v="1">Com %</button><button class="${S.dre.pct ? '' : 'on'}" data-act="drePct" data-v="0">Só valores</button></div>
        <button class="mini" data-act="dreTodos">${S.dre.abertos.size ? 'Recolher contas' : 'Expandir contas'}</button>
        ${botaoPers('dre')}${botoesPDF()}
      </div>
    </div>
    <div class="meses-sel" style="--ec:${corEmpresa(S.empresaVis)}">
      <span class="lbl">Meses exibidos</span>
      ${MESES.map((m, i) => `<button class="chip ${oc.has(i) ? '' : 'on'} ${comDados.has(i) ? '' : 'semdado'}" data-act="dreMes" data-m="${i}" title="${oc.has(i) ? 'Mostrar' : 'Ocultar'} ${MESES_NOME[i]}">${m}</button>`).join('')}
      <span class="sep"></span>
      <button class="mini" data-act="dreMeses" data-p="todos">Todos</button>
      <button class="mini" data-act="dreMeses" data-p="mov">Só com movimento</button>
      <button class="mini" data-act="dreMeses" data-p="s1">1º semestre</button>
      <button class="mini" data-act="dreMeses" data-p="s2">2º semestre</button>
      <button class="mini" data-act="dreMeses" data-p="tri">Último trimestre</button>
    </div>
    <div class="tabwrap congela"><table class="dre ${cfg.compacto ? 'compacto' : ''}"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

const chaveMarkup = () => `markup:${S.empresaVis}:${S.ano}`;
const CORM = { nec: '#2a78d6', usado: '#eb6834', real: '#1baf7a' };

async function viewMarkup() {
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;

  try { lancs = await store.lancs({ ini: `${S.ano}-01-01`, fim: `${S.ano}-12-31`, planilha_id: pid }); } catch (e) { toast(e.message, true); }
  try { prm = await store.getParam(chaveMarkup()); } catch (e) { toast(e.message, true); }
  const z = () => Array(12).fill(0), pos = Object.fromEntries(DRE_POS.map(([k]) => [k, z()])), comDados = new Set();
  for (const l of lancs) {
    const m = Number(l.data_lancamento.slice(5, 7)) - 1, gd = M.gdre[M.plano[l.plano_conta_id]?.grupo_dre_id];
    comDados.add(m);
    if (gd) pos[gd.posicao][m] += sinal(l) * Number(l.valor);
  }
  S.mk = { prm: { ...MK_PADRAO, ...(prm || {}), porMes: { ...(prm?.porMes || {}) } }, pos, comDados };
  renderMarkup();
}

function calcMarkup() {
  const { prm, pos, comDados } = S.mk, L = prm.lucro / 100;
  const meses = Array.from({ length: 12 }, (_, m) => {
    const usado = (prm.porMes[m] ?? prm.usado) / 100, rob = pos.ROB[m];
    if (!comDados.has(m) || rob <= 0) return { m, dados: false, usado };
    const imp = -pos.IMP[m] / rob, fix = -pos.ADM[m] / rob, vend = -pos.DVV[m] / rob, fin = -pos.RFIN[m] / rob;
    const soma = imp + fix + vend + fin + L;
    const mk = soma < 1 ? 1 / (1 - soma) : NaN, mult = mk - 1;
    const custos = imp + fix + vend + fin;
    const lucroProj = 1 - 1 / (1 + usado) - custos;          // lucro se o preço = custo × (1 + multiplicador usado)
    const cmv = -(pos.CMV[m] + pos.VEST[m]);
    const real = cmv > 0 ? rob / cmv - 1 : NaN;              // multiplicador praticado: vendas ÷ custo das mercadorias − 1
    const parcial = S.ano === hoje.getFullYear() && m === hoje.getMonth();
    return { m, dados: true, parcial, imp, fix, vend, fin, lucro: L, soma, mk, mult, usado, dif: usado - mult, lucroProj, real };
  });
  const com = meses.filter(x => x.dados && !(x.parcial && prm.ignorarAtual));   // meses que entram na média
  const media = k => { const v = com.map(x => x[k]).filter(Number.isFinite); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : NaN; };
  const med = Object.fromEntries(['imp', 'fix', 'vend', 'fin', 'lucro', 'soma', 'mk', 'mult', 'dif', 'lucroProj', 'real'].map(k => [k, media(k)]));
  med.usado = meses.reduce((a, x) => a + x.usado, 0) / 12;
  return { meses, med, com };
}

function graficoMarkup(meses) {
  const com = meses.filter(x => x.dados);
  if (!com.length) return '';
  const W = largGraf(12), H = Math.round(Math.min(260, Math.max(200, W * 0.22))), L = 52, R = W < 560 ? 90 : 120, T = 14, B = 30;
  const series = [
    { k: 'mult', n: 'Necessário', c: CORM.nec },
    { k: 'usado', n: 'Usado', c: CORM.usado },
    { k: 'real', n: 'Praticado', c: CORM.real },
  ];
  const vals = com.flatMap(x => series.map(s => x[s.k] * 100)).filter(Number.isFinite);
  const sc = escala(Math.min(0, ...vals), Math.max(...vals));
  const x = m => L + (W - L - R) * (m + 0.5) / 12, y = v => T + (H - T - B) * (sc.hi - v) / (sc.hi - sc.lo);
  let g = '';
  for (let v = sc.lo; v <= sc.hi + sc.passo / 2; v += sc.passo)
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-6 ? CORD.zero : CORD.grade}"/><text x="${L - 8}" y="${y(v) + 4}" font-size="12" fill="${CORD.mut}" text-anchor="end" ${FONTE}>${Math.round(v)}%</text>`;
  MESES.forEach((mm, m) => { g += `<text x="${x(m)}" y="${H - 9}" font-size="12" fill="${meses[m].dados ? CORD.txt : CORD.mut}" text-anchor="middle" ${FONTE}>${mm}</text>`; });
  const fins = [];
  for (const s of series) {
    const pts = com.filter(p => Number.isFinite(p[s.k])).map(p => [x(p.m), y(p[s.k] * 100)]);
    if (!pts.length) continue;
    g += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.k === 'usado' ? 'stroke-dasharray="7 5"' : ''}/>`;
    g += pts.map(([px, py]) => `<circle cx="${px}" cy="${py}" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`).join('');
    fins.push({ y: pts.at(-1)[1], x: pts.at(-1)[0], n: s.n, c: s.c });
  }
  // rótulos no fim das linhas, afastados para não encavalar
  fins.sort((a, b) => a.y - b.y);
  for (let i = 1; i < fins.length; i++) if (fins[i].y - fins[i - 1].y < 16) fins[i].y = fins[i - 1].y + 16;
  const xr = Math.max(...fins.map(f => f.x)) + 12;
  g += fins.map(f => `<rect x="${xr}" y="${f.y - 5}" width="10" height="10" rx="2" fill="${f.c}"/><text x="${xr + 15}" y="${f.y + 4}" font-size="12" fill="${CORD.txt}" font-weight="600" ${FONTE}>${f.n}</text>`).join('');
  g += meses.map(p => `<rect class="hit" x="${x(p.m) - (W - L - R) / 24}" y="${T}" width="${(W - L - R) / 12}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(`${MESES_NOME[p.m]} de ${S.ano}`,
    p.dados ? [[pct(p.mult), 'multiplicador necessário', CORM.nec], [pct(p.usado), 'multiplicador usado', CORM.usado], [pct(p.real), 'multiplicador praticado', CORM.real], [pct(p.lucroProj), 'lucro projetado com o usado', '']] : [[pct(p.usado), 'multiplicador usado', CORM.usado], ['sem vendas', 'no mês', '']])}/>`).join('');
  return `<section class="graf dcard s12" id="mkGraf">
    <div class="dhead"><div><div class="graf-t">Multiplicador mês a mês</div><div class="dsub">necessário para o lucro desejado × usado na formação de preço × praticado nas vendas (vendas ÷ CMV)</div></div></div>
    <div class="leg"><span><i style="background:${CORM.nec}"></i>Necessário</span><span><i style="background:${CORM.usado}"></i>Usado</span><span><i style="background:${CORM.real}"></i>Praticado</span></div>
    <svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Multiplicador necessário, usado e praticado por mês"><rect width="${W}" height="${H}" fill="#fff"/>${g}</svg>
    <div class="tip" hidden></div></section>`;
}

    <tr class="sec"><td class="l">RESULTADO</td><td colspan="13"></td></tr>
    ${linha('Lucro projetado com o markup usado', 'lucroProj', pc, 'proj', '1 − 1 ÷ (1 + multiplicador usado) − (impostos + fixas + vendas + financeiras)')}
    ${linha('Multiplicador praticado (vendas ÷ CMV − 1)', 'real', pc, 'real', 'Quanto as vendas ficaram acima do custo das mercadorias vendidas, pela DRE')}`;

  const alerta = !com.length ? `<div class="mk-alerta neutro">Sem vendas lançadas em ${S.ano} para ${esc(nomeEmpresa(S.empresaVis))}. Os percentuais aparecem assim que houver lançamentos.</div>`
    : inviavel ? `<div class="mk-alerta ruim"><b>Atenção:</b> em algum mês a soma dos percentuais passou de 100% — com esses custos não existe markup que gere o lucro desejado.</div>`

        <div class="kp desp"><div class="l">Multiplicador usado</div><div class="v">${pc(med.usado)}</div><div class="d ${abaixo ? 'ruim' : 'bom'}"><b>${Number.isFinite(med.dif) ? `${med.dif < 0 ? '▼' : '▲'} ${Math.abs(med.dif * 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 })} p.p.` : ''}</b> ${Number.isFinite(med.dif) ? 'vs necessário' : ''}</div></div>

      <section class="graf mk-form">

          <li><b>Mark-up</b> = 1 ÷ (1 − (impostos + fixas + vendas + financeiras + lucro desejado)).</li>
          <li><b>Multiplicador necessário</b> = Mark-up − 1. Preço = custo × Mark-up.</li>
          <li><b>Lucro projetado</b> = 1 − 1 ÷ (1 + multiplicador usado) − (impostos + fixas + vendas + financeiras).</li>
          <li><b>Média</b> = média dos meses com vendas.</li>

function atualizarSimulador() {
  const out = $('mkSimRes'); if (!out) return;
  const custo = parseValor($('mk_custo').value);
  const { meses, med } = calcMarkup();
  const base = S.mkBase == null || S.mkBase === 'media' ? med : meses[Number(S.mkBase)];
  if (!(custo > 0) || !base) { out.innerHTML = '<div class="mut sim-vazio">Digite um custo para simular.</div>'; return; }
  const pNec = custo * base.mk, pUs = custo * (1 + base.usado);
  out.innerHTML = `<div class="sim-res">
    <div><span>Preço para ${pct(S.mk.prm.lucro / 100)} de lucro</span><b>${Number.isFinite(pNec) ? brl(pNec) : '–'}</b><small>custo × ${base.mk?.toLocaleString('pt-BR', { maximumFractionDigits: 3 }) ?? '–'}</small></div>
    <div><span>Preço com o multiplicador usado</span><b>${brl(pUs)}</b><small>custo × ${(1 + base.usado).toLocaleString('pt-BR', { maximumFractionDigits: 3 })} · lucro ${pct(base.lucroProj)}</small></div>
    <div class="${pUs < pNec ? 'ruim' : 'bom'}"><span>Diferença por unidade</span><b>${brl(pUs - pNec)}</b><small>${pUs < pNec ? 'abaixo do preço ideal' : 'acima do preço ideal'}</small></div>
  </div>`;
}

async function salvarMarkup(msg) {
  try { await store.setParam(chaveMarkup(), S.mk.prm); toast(msg); }
  catch (e) { toast(e.message, true); }
  renderMarkup();
}

/* ============================== DASHBOARD ============================== */
// Cores validadas (dataviz): receitas = azul, despesas = laranja; cinza neutro só para totais.
const CORD = { rec: '#2a78d6', desp: '#eb6834', tot: '#58595e', grade: '#ececee', zero: '#9a9ba0', txt: '#2a2b2f', mut: '#74757b' };
const FONTE = `font-family="Segoe UI, Roboto, Arial, sans-serif"`;
const PERIODOS = [
  ['ano', 'Ano inteiro', 0, 11], ['s1', '1º semestre', 0, 5], ['s2', '2º semestre', 6, 11],
  ['t1', '1º trimestre', 0, 2], ['t2', '2º trimestre', 3, 5], ['t3', '3º trimestre', 6, 8], ['t4', '4º trimestre', 9, 11],
  ...MESES_NOME.map((n, i) => ['m' + i, n, i, i]),
];
function periodoDash() {
  const [k, rot, a, b] = PERIODOS.find(p => p[0] === S.dash.per) || PERIODOS[0];
  const len = b - a + 1;
  return {
    k, rot, a, b,
    ini: `${S.ano}-${pad(a + 1)}-01`, fim: `${S.ano}-${pad(b + 1)}-${pad(ultimoDia(S.ano, b))}`,
    pini: isoData(new Date(S.ano, a - len, 1)), pfim: isoData(new Date(S.ano, a, 0)),
    antRot: len === 12 ? `${S.ano - 1}` : len === 1 ? `${MESES_NOME[(a + 11) % 12]}` : 'período anterior',
  };
}
const valorCurto = v => {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (a >= 1e3) return s + (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: a >= 1e5 ? 0 : 1 }) + ' mil';
  return s + Math.round(a).toLocaleString('pt-BR');
};
function escala(lo, hi, n = 4) {
  lo = Math.min(0, lo); hi = Math.max(0, hi);
  if (hi === lo) hi = lo + 1;
  const bruto = (hi - lo) / n, p10 = 10 ** Math.floor(Math.log10(bruto));
  const passo = [1, 2, 2.5, 5, 10].map(k => k * p10).find(k => k >= bruto);
  return { lo: Math.floor(lo / passo) * passo, hi: Math.ceil(hi / passo) * passo, passo };
}
// barra vertical com a ponta arredondada (a base fica reta, encostada no zero)
function barV(x, w, yb, yv, cor, extra = '') {
  const h = Math.abs(yb - yv); if (h < 0.5) return '';
  const r = Math.min(4, w / 2, h), up = yv < yb, d = up ? 1 : -1;
  return `<path d="M${x},${yb} V${yv + d * r} Q${x},${yv} ${x + r},${yv} H${x + w - r} Q${x + w},${yv} ${x + w},${yv + d * r} V${yb} Z" fill="${cor}" ${extra}/>`;
}
function barH(y, h, xb, xv, cor) {
  const w = Math.abs(xv - xb); if (w < 0.5) return '';
  const r = Math.min(4, h / 2, w), dir = xv > xb ? 1 : -1;
  return `<path d="M${xb},${y} H${xv - dir * r} Q${xv},${y} ${xv},${y + r} V${y + h - r} Q${xv},${y + h} ${xv - dir * r},${y + h} H${xb} Z" fill="${cor}"/>`;
}
const gradeY = (sc, y, L, R, W) => {
  let g = '';
  for (let v = sc.lo; v <= sc.hi + sc.passo / 2; v += sc.passo)
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-6 ? CORD.zero : CORD.grade}" stroke-width="${Math.abs(v) < 1e-6 ? 1.2 : 1}"/>`
       + `<text x="${L - 8}" y="${y(v) + 4}" font-size="12" fill="${CORD.mut}" text-anchor="end" ${FONTE}>${valorCurto(v)}</text>`;
  return g;
};
// largura real do gráfico (em px) dentro do cartão: o texto do gráfico fica sempre em 11-12px, em qualquer tela
function largGraf(span) {
  const m = ($('main')?.clientWidth || innerWidth) - (innerWidth <= 760 ? 24 : 36);
  const duas = span === 6 && innerWidth > 1100;
  return Math.max(300, Math.round((duas ? (m - 14) / 2 : m) - 34));
}
let redimT, larguraAnt = innerWidth;
window.addEventListener('resize', () => {

function agregarDash(lancs, ini, fim) {
  const r = { rec: 0, desp: 0, grp: {}, conta: {}, pos: Object.fromEntries(DRE_POS.map(([k]) => [k, 0])), n: 0 };
  for (const l of lancs) {
    if (l.data_lancamento < ini || l.data_lancamento > fim) continue;
    const v = Number(l.valor), s = sinal(l), g = grupoDoPlano(l.plano_conta_id), gd = M.gdre[M.plano[l.plano_conta_id]?.grupo_dre_id];
    if (s > 0) r.rec += v; else r.desp += v;
    r.grp[g?.id ?? 0] = (r.grp[g?.id ?? 0] || 0) + v;
    r.conta[l.plano_conta_id] = (r.conta[l.plano_conta_id] || 0) + v;
    if (gd) r.pos[gd.posicao] += s * v;
    r.n++;
  }
  return r;
}

  const verTodos = S.dash.rxTodos, rxLista = verTodos ? despT : despT.slice(0, 8);
  const cardRaioX = `<section class="graf dcard s12" id="rx">
    <div class="rx-h"><div><div class="graf-t">Raio-X das despesas · para onde vai o dinheiro</div>
      <div class="dsub">${esc(P.rot)} de ${S.ano} · agrupado pelo plano de contas · comparado com ${esc(P.antRot)} · clique num cartão para ver os lançamentos</div></div>
      <div class="rx-tot"><small>Total de despesas</small><b>${brl(at.desp)}</b><button class="mini rx-mbtn" data-act="metasEditar">⚙ Metas</button></div></div>
    ${despT.length ? `<div class="rx-grid">${rxLista.map((t, i) => {
      const dv = t.ant ? (t.v - t.ant) / t.ant : null;
      const top = Object.entries(t.contas).sort((a, b) => b[1] - a[1]).slice(0, 2);
      return `<button type="button" class="rx" style="--tc:${esc(t.c)}" data-act="rxTema" data-t="${t.id}" title="Ver os lançamentos de ${esc(t.n)}">

        <div class="rx-m"><span><b>${at.desp ? pct(t.v / at.desp) : '–'}</b> das despesas</span><span><b>${baseRec > 0 ? pct(t.v / baseRec) : '–'}</b> da receita</span></div>
        <div class="rx-f"><div class="rx-top">${top.map(([pid, val]) => `<div>${esc(M.plano[pid]?.nome ?? '')}<span>${valorCurto(val)}</span></div>`).join('')}</div>${sparkT(tMes[t.id], t.c)}</div>

    : '<div class="ab-vazio">Sem despesas lançadas no período.</div>'}

  // ---------- de cada R$ 100 que entram ----------
  const card100 = (() => {
    if (!(recOper > 0)) return `<section class="graf dcard s6"><div class="graf-t">De cada R$ 100 que entram</div><div class="dsub">${esc(P.rot)}</div><div class="ab-vazio">Sem receitas no período.</div></section>`;
    const prin = despT.slice(0, 6), resto = despT.slice(6).reduce((a, t) => a + t.v, 0), sobra = recOper - at.desp;
    const lin = (ic, nome, val, cls = '') => `<div class="c100-l ${cls}">${ic}<div><div class="n">${esc(nome)}</div><div class="b"><i style="width:${Math.min(100, Math.max(1.5, Math.abs(val) / recOper * 100))}%"></i></div></div>
      <div class="v ${cls.includes('neg') ? 'neg' : ''}">R$ ${num2(val / recOper * 100)}<small>${brl(val)}</small></div></div>`;

        ${lin(`<span class="tema-ic sm" style="--tc:${sobra < 0 ? '#c62828' : '#1e7b3c'}">${icone('alvo')}</span>`, sobra < 0 ? 'Falta (prejuízo)' : 'Sobra (resultado)', sobra, 'fim' + (sobra < 0 ? ' neg' : ''))}
      </div></section>`;
  })();

  // ---------- saúde financeira (indicadores com referência) ----------
  const cardSaude = (() => {
    const ref = (val, bom, at2, menor) => !Number.isFinite(val) ? 'nd' : menor ? (val <= bom ? 'bom' : val <= at2 ? 'at' : 'cr') : (val >= bom ? 'bom' : val >= at2 ? 'at' : 'cr');
    const ST = { bom: '✓ Saudável', at: '! Atenção', cr: '✕ Crítico', nd: 'Sem dados' };
    const rb = baseRec;
    const cmv = rb > 0 ? -(vD.CMV + vD.VEST) / rb : NaN;
    const rh = rb > 0 ? (tAt['d:rh']?.v || 0) / rb : NaN;
    const ocup = rb > 0 ? (tAt['d:ocupacao']?.v || 0) / rb : NaN;
    const mc = rb > 0 ? vD.MC / rb : NaN;
    const meses = P.b - P.a + 1, peMes = Number.isFinite(vD.PE) ? vD.PE / meses : NaN, recMes = rb / meses;
    const cob = peMes > 0 ? recMes / peMes : NaN;
    const fimP = P.fim < HOJE ? P.fim : HOJE, dias = Math.max(1, Math.round((new Date(fimP + 'T12:00') - new Date(P.ini + 'T12:00')) / 864e5) + 1);
    const diasCx = at.desp > 0 ? saldo / (at.desp / dias) : NaN;
    const I = [
      ['flores', 'd:flores', 'Custo das flores e insumos (CMV)', 'quanto da receita vai para mercadoria · ref. até 35%', pct(cmv), ref(cmv, .35, .45, true)],
      ['rh', 'd:rh', 'Folha e RH', 'salários e encargos sobre a receita · ref. até 20%', pct(rh), ref(rh, .20, .30, true)],
      ['ocupacao', 'd:ocupacao', 'Aluguel, água e energia', 'peso da estrutura da loja · ref. até 10%', pct(ocup), ref(ocup, .10, .15, true)],
      ['pct', null, 'Margem de contribuição', 'o que sobra para pagar as despesas fixas · ref. acima de 45%', pct(mc), ref(mc, .45, .30, false)],
      ['balanca', null, 'Ponto de equilíbrio', Number.isFinite(peMes) ? `precisa vender ${brl(peMes)}/mês · vendendo ${brl(recMes)}/mês` : 'faturamento mínimo para não ter prejuízo', Number.isFinite(cob) ? (cob * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '% coberto' : '–', ref(cob, 1.1, 1, false)],
      ['relogio', null, 'Fôlego de caixa', 'quantos dias o saldo dos bancos paga as despesas', Number.isFinite(diasCx) ? `${Math.max(0, Math.round(diasCx))} dias` : '–', ref(diasCx, 30, 10, false)],
    ];
    return `<section class="graf dcard s6">
      <div class="graf-t">Saúde financeira</div><div class="dsub">${esc(P.rot)} · indicadores com referência para floricultura</div>
      <div class="sd">${I.map(([ic, tema, nome, sub, val, st]) => `<div class="sd-l">${tema ? temaIc(tema, 'tema-ic sm') : `<span class="tema-ic sm" style="--tc:#58595e">${icone(ic)}</span>`}
        <div class="n"><b>${esc(nome)}</b><small>${esc(sub)}</small></div>
        <div class="v"><b>${esc(val)}</b><span class="st ${st}">${ST[st]}</span></div></div>`).join('')}</div>
      <div class="sd-nota">As referências são parâmetros gerais de varejo; ajuste a leitura conforme a realidade da loja.</div></section>`;
  })();
  // ---------- 1. Receitas x despesas por mês ----------
  const g1 = (() => {
    const W = largGraf(12), H = Math.round(Math.min(250, Math.max(190, W * 0.2))), L = 58, R = 12, T = 12, B = 30;
    if (!recM.some(v => v) && !despM.some(v => v)) return semDados(W, H);
    const sc = escala(0, Math.max(...recM, ...despM)), y = v => T + (H - T - B) * (sc.hi - v) / (sc.hi - sc.lo);
    const gw = (W - L - R) / 12, bw = Math.min(28, gw * 0.32);
    let marcas = '', hits = '';
    for (let m = 0; m < 12; m++) {
      const cx = L + gw * (m + 0.5), op = noPer(m) ? '' : 'opacity="0.3"';

        + `<text x="${cx}" y="${H - 9}" font-size="12" fill="${noPer(m) ? CORD.txt : CORD.mut}" font-weight="${noPer(m) ? 700 : 400}" text-anchor="middle" ${FONTE}>${MESES[m]}</text>`;

    }
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês"><rect width="${W}" height="${H}" fill="#fff"/>${gradeY(sc, y, L, R, W)}${marcas}${hits}</svg>`;
  })();
  const t1 = `<table class="zebra"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Resultado</th></tr></thead><tbody>${MESES_NOME.map((n, m) => `<tr><td>${n}</td><td class="r">${num2(recM[m])}</td><td class="r">${num2(despM[m])}</td><td class="r ${clsSinal(recM[m] - despM[m])}">${num2(recM[m] - despM[m])}</td></tr>`).join('')}</tbody></table>`;

  // ---------- 2. Do faturamento ao resultado (cascata da DRE) ----------
  const v = calcularLinhas({ ...at.pos });
  const passos = [['Receita bruta', v.ROB, 'tot'], ['Não operacionais', v.RNO], ['Impostos', v.IMP], ['CMV', v.CMV + v.VEST], ['Desp. variáveis', v.DVV], ['Margem contrib.', v.MC, 'tot'],
    ['Desp. ADM', v.ADM], ['EBITDA', v.EBITDA, 'tot'], ['Financeiro', v.RFIN], ['Dívidas', v.EMP + v.POS + v.CAPT], ['Geração de caixa', v.GER, 'tot']]
    .filter(([, val, t]) => t || Math.abs(val) > 0.5);
  const g2 = (() => {
    const W = largGraf(6), H = Math.round(Math.min(290, Math.max(230, W * 0.45))), L = 54, R = 10, T = 22, B = 46;
    if (!at.n) return semDados(W, H);
    let acc = 0; const barras = passos.map(([rot, val, t]) => { const de = t ? 0 : acc, ate = t ? val : acc + val; acc = t ? val : acc + val; return { rot, val, de, ate, t }; });
    const sc = escala(Math.min(...barras.flatMap(b => [b.de, b.ate])), Math.max(...barras.flatMap(b => [b.de, b.ate])));
    const y = q => T + (H - T - B) * (sc.hi - q) / (sc.hi - sc.lo), gw = (W - L - R) / barras.length, bw = Math.min(34, gw * 0.62);
    let s = gradeY(sc, y, L, R, W);
    barras.forEach((b, i) => {
      const x = L + gw * i + (gw - bw) / 2, cor = b.t ? CORD.tot : b.val >= 0 ? CORD.rec : CORD.desp;
      const top = Math.min(y(b.de), y(b.ate)), h = Math.max(1, Math.abs(y(b.de) - y(b.ate)));
      s += b.t ? barV(x, bw, y(0), y(b.ate), cor) : `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="2" fill="${cor}"/>`;
      if (i < barras.length - 1) s += `<line x1="${x + bw}" x2="${x + gw}" y1="${y(b.ate)}" y2="${y(b.ate)}" stroke="${CORD.zero}" stroke-dasharray="2 2"/>`;
      const estreito = gw < 44, ly = b.val >= 0 || b.t ? top - 6 : top + h + 13;
      if (estreito && !b.t) { s += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(b.rot, [[brl(b.val), b.val >= 0 ? 'soma' : 'subtrai', b.val >= 0 ? CORD.rec : CORD.desp]])}/>`; return; }
      s += `<text x="${x + bw / 2}" y="${ly}" font-size="11" font-weight="${b.t ? 700 : 400}" fill="${CORD.txt}" text-anchor="middle" ${FONTE}>${valorCurto(b.val)}</text>`;
      const pal = b.rot.split(' ');
      s += `<text x="${x + bw / 2}" y="${H - 28}" font-size="11" fill="${CORD.mut}" text-anchor="middle" ${FONTE}>${esc(pal[0])}</text>` + (pal[1] ? `<text x="${x + bw / 2}" y="${H - 14}" font-size="11" fill="${CORD.mut}" text-anchor="middle" ${FONTE}>${esc(pal.slice(1).join(' '))}</text>` : '');
      s += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(b.rot, [[brl(b.val), b.t ? 'subtotal' : b.val >= 0 ? 'soma' : 'subtrai', b.t ? CORD.tot : b.val >= 0 ? CORD.rec : CORD.desp], ...(v.ROB ? [[pct(b.val / v.ROB), 'da receita bruta', '']] : [])])}/>`;
    });
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cascata do faturamento ao resultado">${`<rect width="${W}" height="${H}" fill="#fff"/>`}${s}</svg>`;
  })();
  const t2 = `<table class="zebra"><thead><tr><th>Etapa</th><th>Valor</th><th>% receita bruta</th></tr></thead><tbody>${passos.map(([r, val, t]) => `<tr><td>${t ? `<b>${esc(r)}</b>` : esc(r)}</td><td class="r ${clsSinal(val)}">${num2(val)}</td><td class="r">${v.ROB ? pct(val / v.ROB) : '–'}</td></tr>`).join('')}</tbody></table>`;

  // ---------- 3. Resultado mensal ----------
  const resM = recM.map((r, m) => r - despM[m]);
  const g3 = (() => {
    const W = largGraf(6), H = Math.round(Math.min(290, Math.max(220, W * 0.45))), L = 54, R = 10, T = 14, B = 30;
    if (!resM.some(x => x)) return semDados(W, H);
    const sc = escala(Math.min(...resM), Math.max(...resM)), y = q => T + (H - T - B) * (sc.hi - q) / (sc.hi - sc.lo);
    const gw = (W - L - R) / 12, bw = Math.min(26, gw * 0.6);
    let s = gradeY(sc, y, L, R, W);
    resM.forEach((r, m) => {
      const x = L + gw * m + (gw - bw) / 2, op = noPer(m) ? '' : 'opacity="0.3"';
      s += barV(x, bw, y(0), y(r), r >= 0 ? CORD.rec : CORD.desp, op)
        + `<text x="${x + bw / 2}" y="${H - 9}" font-size="11" fill="${noPer(m) ? CORD.txt : CORD.mut}" font-weight="${noPer(m) ? 700 : 400}" text-anchor="middle" ${FONTE}>${MESES[m]}</text>`
        + `<rect class="hit" x="${L + gw * m}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(`${MESES_NOME[m]} de ${S.ano}`, [[brl(r), r >= 0 ? 'lucro' : 'prejuízo', r >= 0 ? CORD.rec : CORD.desp], [recM[m] ? pct(r / recM[m]) : '–', 'margem', '']])}/>`;
    });
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resultado mensal">${`<rect width="${W}" height="${H}" fill="#fff"/>`}${s}</svg>`;
  })();
  const t3 = `<table class="zebra"><thead><tr><th>Mês</th><th>Resultado</th><th>Margem</th></tr></thead><tbody>${resM.map((r, m) => `<tr><td>${MESES_NOME[m]}</td><td class="r ${clsSinal(r)}">${num2(r)}</td><td class="r">${recM[m] ? pct(r / recM[m]) : '–'}</td></tr>`).join('')}</tbody></table>`;

  // ---------- barras horizontais ordenadas ----------
  const ranking = (itens, cor, total, rotTot, comLogo = false) => {
    const W = largGraf(6), LBL = W < 520 ? (comLogo ? 140 : 130) : W > 900 ? 300 : comLogo ? 200 : 230, R = W < 520 ? 92 : 112, rowH = 28, T = 6;
    if (!itens.length) return semDados(W, 200);
    const H = T + itens.length * rowH + 6, maxV = Math.max(...itens.map(i => Math.abs(i.v))), minV = Math.min(0, ...itens.map(i => i.v));
    const x0 = LBL + (minV < 0 ? (W - LBL - R) * (-minV) / (maxV - minV) : 0), sx = q => x0 + (W - LBL - R) * q / (maxV - minV || 1);
    let s = minV < 0 ? `<line x1="${x0}" x2="${x0}" y1="${T}" y2="${H - 6}" stroke="${CORD.zero}"/>` : '';
    itens.forEach((it, i) => {
      const yy = T + i * rowH, c = typeof cor === 'function' ? cor(it.v) : cor, mx = Math.floor((LBL - (comLogo ? 30 : 6)) / 6.6), nome = it.n.length > mx ? it.n.slice(0, mx - 1) + '…' : it.n;
      if (comLogo && it.logo) s += `<image href="${it.logo}" x="0" y="${yy + 6}" width="18" height="18"/>`;

        + `<text x="${Math.max(sx(it.v), x0) + 6}" y="${yy + 19}" font-size="12" font-weight="700" fill="${CORD.txt}" ${FONTE}>${valorCurto(it.v)}${total ? `<tspan font-weight="400" fill="${CORD.mut}">  ${pct(it.v / total)}</tspan>` : ''}</text>`
        + `<rect class="hit" x="0" y="${yy}" width="${W}" height="${rowH}" fill="transparent" tabindex="0" ${dt(it.n, [[brl(it.v), rotTot, c], ...(total ? [[pct(it.v / total), 'do total', '']] : [])])}/>`;
    });
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img"><rect width="${W}" height="${H}" fill="#fff"/>${s}</svg>`;
  };
  const tabRank = (itens, cab, total) => `<table class="zebra"><thead><tr><th>${cab}</th><th>Valor</th>${total ? '<th>%</th>' : ''}</tr></thead><tbody>${itens.map(i => `<tr><td>${esc(i.n)}</td><td class="r ${i.v < 0 ? 'neg' : ''}">${num2(i.v)}</td>${total ? `<td class="r">${pct(i.v / total)}</td>` : ''}</tr>`).join('')}</tbody></table>`;
  const topN = (arr, n) => { const o = [...arr].sort((a, b) => b.v - a.v); if (o.length <= n) return o; const resto = o.slice(n - 1).reduce((a, i) => a + i.v, 0); return [...o.slice(0, n - 1), { n: `Outros (${o.length - n + 1})`, v: resto }]; };
  const despGrp = topN(S.grupos.filter(g => g.tipo === 'DESPESA' && at.grp[g.id]).map(g => ({ n: g.nome, v: at.grp[g.id] })), 8);
  const despConta = topN(S.plano_contas.filter(p => grupoDoPlano(p.id)?.tipo === 'DESPESA' && at.conta[p.id]).map(p => ({ n: `${p.codigo} ${p.nome}`, v: at.conta[p.id] })), 10);
  const recGrp = topN(S.grupos.filter(g => g.tipo === 'RECEITA' && at.grp[g.id]).map(g => ({ n: g.nome, v: at.grp[g.id] })), 6);
  const bancos = (bancosSoDaEmpresa(S.empresaVis).length ? bancosSoDaEmpresa(S.empresaVis) : S.bancos).map(b => ({ n: b.nome, v: saldosB[b.id] || 0, logo: logoBanco(b) })).sort((a, b) => b.v - a.v);

  $('main').innerHTML = `
    <div class="dash-hero" style="--ec:${esc(corEmpresa(S.empresaVis))}">
      <div class="dh-t">
        <small>Painel financeiro · ${esc(P.rot)} de ${S.ano}</small>
        <h2>${esc(nomeNaTela(S.empresaVis, 'DASHBOARD'))}</h2>
        <p>Comparado com ${esc(P.antRot)} · passe o mouse nos gráficos para ver os valores${S.empresaVis === 'all' ? ` · ${esc(S.planilhas.map(p => siglaEmpresa(p.id)).join(' + '))}` : ''}</p>
      </div>
      <div class="dh-f">
        ${barraAno()}
        <div class="dmes-nav"><button data-act="dashMes" data-d="-1" title="Mês anterior" aria-label="Mês anterior">‹</button><button data-act="dashMes" data-d="0" title="Voltar para o mês atual">Mês atual</button><button data-act="dashMes" data-d="1" title="Próximo mês" aria-label="Próximo mês">›</button></div>
        <select class="dper" data-chg="dashPer">${PERIODOS.map(([k, r], i) => `${i === 7 ? '<optgroup label="Mês">' : ''}<option value="${k}" ${k === P.k ? 'selected' : ''}>${r}</option>`).join('')}</optgroup></select>
      </div>
    </div>
    <div class="barra">${abasEmpresa(S.empresaVis, 'empresaVis', false, 'DASHBOARD')}</div>
    ${kpis}
    <div class="dgrid">
      ${cardRaioX}
      ${card100}
      ${cardSaude}
      ${cardAbertos}

function dicaDash(alvo, ev) {
  const card = alvo?.closest('.dcard'); if (!card) return;
  const tip = card.querySelector('.tip');
  tip.replaceChildren();
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = alvo.dataset.tt; tip.append(t);
  for (const [val, rot, cor] of JSON.parse(alvo.dataset.tv || '[]')) {
    const d = document.createElement('div');
    if (cor) { const i = document.createElement('i'); i.className = 'sw'; i.style.background = cor; d.append(i); }
    const b = document.createElement('b'); b.textContent = val; if (val.startsWith('-')) b.className = 'neg';
    d.append(b, document.createTextNode(' ' + rot)); tip.append(d);
  }
  tip.hidden = false;
  const box = card.getBoundingClientRect(), r = alvo.getBoundingClientRect();
  const px = ev?.clientX ?? (r.left + r.width / 2), py = ev?.clientY ?? (r.top + r.height / 2);
  let left = px - box.left + 16, top = py - box.top + 16;
  if (left + tip.offsetWidth > box.width - 6) left = px - box.left - tip.offsetWidth - 16;
  if (top + tip.offsetHeight > box.height - 6) top = py - box.top - tip.offsetHeight - 12;
  tip.style.left = `${Math.max(6, left)}px`; tip.style.top = `${Math.max(6, top)}px`;
  card.querySelectorAll('.hit.on').forEach(h => h !== alvo && h.classList.remove('on')); alvo.classList.add('on');
}

/* ======================= FLUXO DE CAIXA ACUMULADO ======================= */
// Visão anual mês a mês: saldo inicial, entradas e saídas por grupo, resultado e saldo acumulado.
// Caixa inicial = saldo, na data, dos bancos ligados à empresa (Consolidado = todos os bancos).
// Se a empresa ainda não tem nenhum banco ligado, usa o saldo inicial do cadastro da empresa.
async function caixaInicial(pid, data) {
  const bs = bancosSoDaEmpresa(pid);
  if (pid != null && !bs.length) return { valor: await store.saldoAte(pid, data), bancos: [], fonte: 'empresa' };
  const saldos = await store.saldosBancos(data);
  const bancos = bs.map(b => ({ b, v: r2(Number(saldos[b.id]) || 0) }));
  return { valor: r2(bancos.reduce((a, x) => a + x.v, 0)), bancos, fonte: 'bancos' };
}

async function viewFluxoAcum() {
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  let lancs = [], s0 = 0, cx = { valor: 0, bancos: [], fonte: 'bancos' };
  try { [lancs, cx] = await Promise.all([store.lancs({ ini: `${S.ano}-01-01`, fim: `${S.ano}-12-31`, planilha_id: pid }), caixaInicial(pid, `${S.ano}-01-01`)]); s0 = cx.valor; }
  catch (e) { toast(e.message, true); }
  const z = () => Array(12).fill(0);
  const grp = {}, conta = {}, ent = z(), sai = z(), comDados = new Set();
  for (const l of lancs) {
    if (!pagoNoBanco(l)) continue;                     // só entra o que já foi pago/recebido no banco (igual ao saldo dos bancos)
    const m = Number(l.data_lancamento.slice(5, 7)) - 1, v = Number(l.valor), g = grupoDoPlano(l.plano_conta_id);
    comDados.add(m);
    (grp[g?.id ?? 0] ||= z())[m] += v;
    (conta[l.plano_conta_id] ||= z())[m] += v;
    if (sinal(l) > 0) ent[m] += v; else sai[m] += v;
  }
  const ini = z(), fim = z();
  let s = s0;
  for (let m = 0; m < 12; m++) { ini[m] = s; s = r2(s + ent[m] - sai[m]); fim[m] = s; }
  S.fa = { ...(S.fa || {}), grp, conta, ent, sai, ini, fim, s0, cx, comDados, abertos: S.fa?.abertos || new Set() };
  renderFluxoAcum();
}

function graficoSaldo(fim, ultimo) {
  // uma série só (saldo acumulado), um eixo; dica com os valores ao passar o mouse
  const meses = [...Array(ultimo + 1).keys()];
  if (!meses.length) return '';
  const W = 1000, H = 230, L = 78, R = 16, T = 16, B = 30;
  const vals = meses.map(m => fim[m]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const passo = (() => { const bruto = (hi - lo) / 4, p10 = 10 ** Math.floor(Math.log10(bruto)); return [1, 2, 2.5, 5, 10].map(k => k * p10).find(k => k >= bruto); })();
  lo = Math.floor(lo / passo) * passo; hi = Math.ceil(hi / passo) * passo;
  const x = m => L + (W - L - R) * (m + 0.5) / 12, y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  const curto = v => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : a >= 1e3 ? Math.round(a / 1e3) + ' mil' : Math.round(a)); };
  let grade = '';
  for (let v = lo; v <= hi + passo / 2; v += passo) grade += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${Math.abs(v) < 1e-6 ? 'zero' : 'gl'}"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${curto(v)}</text>`;
  const pts = meses.map(m => `${x(m)},${y(fim[m])}`).join(' ');
  const area = `${x(0)},${y(Math.max(lo, 0))} ${pts} ${x(ultimo)},${y(Math.max(lo, 0))}`;
  return `<div class="graf" id="grafSaldo">
    <div class="graf-t">Saldo acumulado mês a mês <span class="mut">· passe o mouse sobre os meses</span></div>
    <svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo acumulado mês a mês em ${S.ano}">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>
      ${grade}
      ${MESES.map((mm, m) => `<text x="${x(m)}" y="${H - 9}" class="ax" text-anchor="middle">${mm}</text>`).join('')}
      <polygon points="${area}" class="area"/>
      <polyline points="${pts}" class="linha"/>
      ${meses.map(m => `<circle cx="${x(m)}" cy="${y(fim[m])}" r="4.5" class="pt ${fim[m] < 0 ? 'negp' : ''}"/>`).join('')}
      ${meses.map(m => `<rect x="${x(m) - (W - L - R) / 24}" y="${T}" width="${(W - L - R) / 12}" height="${H - T - B}" class="hit" data-fa-m="${m}" tabindex="0"/>`).join('')}
    </svg>
    <div class="tip" id="faTip" hidden></div>
  </div>`;
}

/* ========================== BANCOS / EXTRATOS ========================== */
async function viewBancos() {
  if (S.bk.aba === 'fluxo') return viewBkFluxo();
  const B = S.bk;
  if (!B.ini) { const p = periodoMes(); B.ini = p.ini; B.fim = p.fim; }
  let saldos = {}, lancs = [], transfs = [];
  try { [saldos, lancs, transfs] = await Promise.all([store.saldosBancos(B.ini), store.lancs({ ini: B.ini, fim: B.fim }), store.transfs({ ini: B.ini, fim: B.fim })]); }
  catch (e) { toast(e.message, true); }
  const mv = Object.fromEntries(S.bancos.map(b => [b.id, { ent: 0, sai: 0 }]));
  const movs = [];
  for (const l of lancs) {
    if (!pagoNoBanco(l)) continue;                     // em aberto: ainda não passou por nenhum banco
    const v = sinal(l) * Number(l.valor);
    if (mv[l.banco_id]) mv[l.banco_id][v > 0 ? 'ent' : 'sai'] += Math.abs(v);
    movs.push({ data: l.data_lancamento, ord: l.id, banco: l.banco_id, emp: l.planilha_id, desc: l.item, conta: planoLabel(l.plano_conta_id), valor: v, tipo: v > 0 ? 'E' : 'S', aj: !!(l.ajustes && Object.keys(l.ajustes).length) });
  }
  for (const t of transfs) {
    const v = Number(t.valor), aj = !!(t.ajustes && Object.keys(t.ajustes).length);
    if (mv[t.banco_origem_id]) mv[t.banco_origem_id].sai += v;
    if (mv[t.banco_destino_id]) mv[t.banco_destino_id].ent += v;
    movs.push({ data: t.data, ord: t.id + 1e9, banco: t.banco_origem_id, emp: null, desc: `${t.descricao || 'Transferência'} → ${M.banco[t.banco_destino_id]?.nome ?? ''}`, conta: 'TRANSFERÊNCIA ENVIADA', valor: -v, tipo: 'T', aj });
    movs.push({ data: t.data, ord: t.id + 1e9 + .5, banco: t.banco_destino_id, emp: null, desc: `${t.descricao || 'Transferência'} ← ${M.banco[t.banco_origem_id]?.nome ?? ''}`, conta: 'TRANSFERÊNCIA RECEBIDA', valor: v, tipo: 'T', aj });
  }
  movs.sort((a, b) => a.data.localeCompare(b.data) || a.ord - b.ord);
  const tot = { ini: 0, ent: 0, sai: 0 };
  for (const b of S.bancos) { tot.ini += saldos[b.id] || 0; tot.ent += mv[b.id].ent; tot.sai += mv[b.id].sai; }
  S.bk.dados = { saldos, mv, movs, tot };
  if (B.sel !== 'all') { S.bk.fx = { ...(S.bk.fx || {}), vis: 'b:' + B.sel, mes: B.ini.slice(0, 7) }; await carregarBkFluxo(); }
  renderBancos();
}

  const C = m => ({

    empresa: `<td class="c">${m.emp ? `<span class="tag tag-emp">${esc((M.planilha[m.emp]?.nome ?? '').replace('LANÇAMENTOS ', ''))}</span>` : '<span class="tag tag-tr">TRANSF.</span>'}</td>`,

const visBk = v => v.startsWith('e:') ? { pid: Number(v.slice(2)), banco: null, rot: siglaEmpresa(Number(v.slice(2))), cor: corEmpresa(Number(v.slice(2))) }
  : v.startsWith('b:') ? { pid: null, banco: Number(v.slice(2)), rot: M.banco[Number(v.slice(2))]?.nome ?? '', cor: corEmpresa(M.banco[Number(v.slice(2))]?.planilha_id ?? 'all') }
  : { pid: null, banco: null, rot: 'Todos os bancos', cor: '#2f3034' };
async function viewBkFluxo() {
  await carregarBkFluxo();
  if (S.bk.aba === 'fluxo') renderBancosShell(renderBkFluxo()); else renderBancos();
}
async function carregarBkFluxo() {
  const F = S.bk.fx ||= { vis: S.planilhaId ? 'e:' + S.planilhaId : 'all', mes: `${hoje.getFullYear()}-${pad(hoje.getMonth() + 1)}` };
  const [a, m] = F.mes.split('-').map(Number), ini = `${F.mes}-01`, fim = `${F.mes}-${pad(ultimoDia(a, m - 1))}`, V = visBk(F.vis);
  let lancs = [];
  try { lancs = await store.lancs({ ini, fim, planilha_id: V.pid, banco_id: V.banco }); } catch (e) { toast(e.message, true); }
  const dias = Array.from({ length: ultimoDia(a, m - 1) }, (_, i) => ({ dia: i + 1, data: `${F.mes}-${pad(i + 1)}`, rec: 0, desp: 0, n: 0 }));
  for (const l of lancs) {
    if (!pagoNoBanco(l)) continue;
    const d = dias[Number(l.data_lancamento.slice(8, 10)) - 1]; if (!d) continue;
    sinal(l) > 0 ? d.rec += Number(l.valor) : d.desp += Number(l.valor); d.n++;
  }
  S.bk.fxDados = { dias, ini, fim, V, a, m };
}

function exportarCSV() {
  const { linhas, saldoAnt, filtrado } = S.bk.export || {};
  if (!linhas) return;
  const n = v => num2(v).replace(/\./g, '');
  const rows = [['Data', 'Banco', 'Empresa', 'Descrição', 'Conta', 'Entrada', 'Saída', ...(filtrado ? [] : ['Saldo'])]];
  if (!filtrado) rows.push([fmtData(S.bk.ini), '', '', 'Saldo anterior', '', '', '', n(saldoAnt)]);
  for (const m of linhas) rows.push([fmtData(m.data), M.banco[m.banco]?.nome ?? '', m.emp ? M.planilha[m.emp]?.nome ?? '' : 'TRANSFERÊNCIA', m.desc ?? '', m.conta, m.valor > 0 ? n(m.valor) : '', m.valor < 0 ? n(-m.valor) : '', ...(filtrado ? [] : [n(m.saldo)])]);
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `extrato_${S.bk.ini}_${S.bk.fim}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ======================= IMPORTAR PLANILHA (Excel / CSV) ======================= */
// Lê a planilha de lançamentos (Tipo Pagamento | Data do Lançamento | Classificação | Plano de Contas | Item | Valor |
// Data Programada | Data de Pagamento), casa bancos e contas com os cadastros, mostra a prévia e grava na empresa escolhida.
const XLSX_LIB = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let xlsxLib;
const libXLSX = () => xlsxLib ||= new Promise((ok, falha) => {
  if (window.XLSX) return ok(window.XLSX);
  const s = document.createElement('script');
  s.src = XLSX_LIB; s.onload = () => ok(window.XLSX);
  s.onerror = () => { xlsxLib = null; falha(new Error('Não foi possível carregar o leitor de planilhas. Verifique a conexão com a internet.')); };
  document.head.appendChild(s);
});
const IMP_MAP_KEY = 'cap_import_map_v1';
let IMP = null;
const normTxt = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const impMemo = () => { try { return JSON.parse(localStorage.getItem(IMP_MAP_KEY)) || { banco: {}, plano: {} }; } catch (e) { return { banco: {}, plano: {} }; } };
