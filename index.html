function impData(v) {
  if (v == null || v === '') return null;
  let iso = null, m;
  if (typeof v === 'number') { if (v > 20000 && v < 80000) iso = new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10); }
  else if (v instanceof Date) { if (!isNaN(v)) iso = isoData(v); }
  else {
    const s = String(v).trim();
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) { let a = Number(m[3]); if (a < 100) a += 2000; iso = `${a}-${pad(m[2])}-${pad(m[1])}`; }
    else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) iso = `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  }
  if (!iso) return null;
  const [a, mm, d] = iso.split('-').map(Number);
  return mm >= 1 && mm <= 12 && d >= 1 && d <= ultimoDia(a, mm - 1) ? iso : null;
}
function impValor(v) {
  if (v == null || v === '') return null;
  const n = typeof v === 'number' ? r2(v) : parseValor(String(v).replace(/^\((.*)\)$/, '-$1'));
  return Number.isFinite(n) && Math.abs(n) >= 0.005 ? r2(Math.abs(n)) : null;
}

// colunas pelo título (a ordem pode variar); sem títulos reconhecidos, usa a ordem padrão da planilha
const IMP_COLS = [
  ['pag', /DATA (DE |DO )?PAGAMENTO|PAGO EM|DATA PAGTO/],
  ['prog', /PROGRAMADA|VENCIMENTO/],
  ['data', /DATA (DO |DE )?LANCAMENTO|^DATA$/],
  ['banco', /TIPO PAGAMENTO|BANCO|CONTA BANCARIA|^CONTA$/],
  ['plano', /PLANO/],
  ['item', /^ITEM|DESCRICAO|HISTORICO/],
  ['valor', /^VALOR/],
];
function impColunas(linhas) {
  for (let i = 0; i < Math.min(15, linhas.length); i++) {
    const col = {};
    (linhas[i] || []).forEach((h, j) => {
      const n = normTxt(h); if (!n) return;
      const k = IMP_COLS.find(([k, re]) => !(k in col) && re.test(n));
      if (k) col[k[0]] = j;
    });
    if (['data', 'plano', 'valor'].every(k => k in col)) return { col, ini: i + 1 };
  }
  return { col: { banco: 0, data: 1, plano: 3, item: 4, valor: 5, prog: 6, pag: 7 }, ini: 0 };
}

function casarPlano(txt) {
  const s = String(txt ?? '').trim(); if (!s) return null;
  const m = s.match(/^(\d+(?:\.\d+)*)\.?\s*[-–]?\s*(.*)$/);
  const cod = m ? m[1] : '', nome = normTxt(m ? m[2] : s);
  const P = S.plano_contas.map(p => ({ p, n: normTxt(p.nome) }));
  let c = P.filter(x => x.n === nome && nome);
  if (c.length) return (c.find(x => x.p.codigo === cod) || c[0]).p.id;
  if (nome.length >= 4) { c = P.filter(x => x.n.length >= 4 && (x.n.includes(nome) || nome.includes(x.n))); if (c.length === 1) return c[0].p.id; }
  if (!nome && cod) { c = P.filter(x => x.p.codigo === cod); if (c.length === 1) return c[0].p.id; }
  return null;
}
function casarBanco(txt, pid) {
  const n = normTxt(txt); if (!n) return null;
  const lista = bancosDaEmpresa(pid);
  const b = lista.find(x => normTxt(x.nome) === n) || S.bancos.find(x => normTxt(x.nome) === n);
  if (b) return b.id;
  const c = lista.filter(x => { const k = normTxt(x.nome); return k.length >= 4 && (k.includes(n) || n.includes(k)); });
  return c.length === 1 ? c[0].id : null;
}

function impAbrir() {
  if (!S.planilhas.length) return toast('Cadastre uma empresa antes de importar.', true);
  const inp = $('imp_arq'); if (!inp) return;
  inp.value = ''; inp.click();
}

async function impArquivo(arq) {
  if (!arq) return;
  let X;
  toast('Lendo a planilha…');
  try { X = await libXLSX(); } catch (e) { return toast(e.message, true); }
  let linhas;
  try {
    const wb = X.read(await arq.arrayBuffer(), { type: 'array', raw: false, cellDates: false });
    // usa a primeira aba que tenha os títulos de lançamentos (ou a primeira aba)
    const abas = wb.SheetNames.map(n => X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: false }));
    linhas = abas.find(l => impColunas(l).ini > 0) || abas[0] || [];
  } catch (e) { return toast('Não foi possível ler o arquivo. Use uma planilha Excel (.xlsx / .xls) ou CSV.', true); }
  const { col, ini } = impColunas(linhas);
  const get = (r, k) => k in col ? r[col[k]] : null;
  const L = [];
  for (let i = ini; i < linhas.length; i++) {
    const r = linhas[i] || [];
    if (!r.some(v => v != null && String(v).trim() !== '')) continue;
    const l = {
      n: i + 1,
      bancoTxt: String(get(r, 'banco') ?? '').trim(),
      data: impData(get(r, 'data')),
      planoTxt: String(get(r, 'plano') ?? '').trim(),
      item: String(get(r, 'item') ?? '').trim(),
      valor: impValor(get(r, 'valor')),
      prog: impData(get(r, 'prog')),
      pag: impData(get(r, 'pag')),
    };
    l.ign = !l.data ? 'Sem data' : l.valor == null ? 'Sem valor' : !l.planoTxt ? 'Sem conta' : '';
    L.push(l);
  }
  if (!L.length) return toast('Nenhum lançamento encontrado no arquivo.', true);

  // empresa de destino: a aba aberta, ou a que aparece no nome dos bancos (ex.: "DINHEIRO DK")
  const cont = {};
  for (const l of L) for (const p of S.planilhas) { const sg = normTxt(siglaEmpresa(p.id)); if (sg && new RegExp(`(^| )${sg}$`).test(normTxt(l.bancoTxt))) cont[p.id] = (cont[p.id] || 0) + 1; }
  const melhor = Object.entries(cont).sort((a, b) => b[1] - a[1])[0];
  const dest = melhor && Number(melhor[0]) !== S.planilhaId && melhor[1] > (cont[S.planilhaId] || 0) ? Number(melhor[0]) : S.planilhaId;
  IMP = { arq: arq.name, linhas: L, dest, detectou: dest !== S.planilhaId, mapB: {}, mapP: {}, filtro: '', exist: {}, salvando: false };
  impCasar();
  abrirModal(`<div id="imp"></div>`, 'm-imp', () => { IMP = null; });
  await impExistentes();
}

// casa bancos (dependem da empresa) e contas; o que não casar fica para o usuário escolher
function impCasar() {
  const memo = impMemo();
  const valido = (v, tab) => v === 0 || v === 'x' || (tab === 'b' ? !!M.banco[v] : !!M.plano[v]);
  const mapB = {}, mapP = {};
  for (const l of IMP.linhas) {
    const kb = normTxt(l.bancoTxt);
    if (kb && !(kb in mapB)) {
      const ant = IMP.mapB[kb], m = memo.banco[`${IMP.dest}|${kb}`];
      mapB[kb] = ant?.manual ? ant : casarBanco(l.bancoTxt, IMP.dest) != null ? { v: casarBanco(l.bancoTxt, IMP.dest), auto: true }
        : m != null && valido(m, 'b') ? { v: m, manual: true } : { v: '' };
      mapB[kb].txt = l.bancoTxt;
    }
    const kp = normTxt(l.planoTxt);
    if (kp && !(kp in mapP)) {
      const ant = IMP.mapP[kp], m = memo.plano[kp];
      mapP[kp] = ant?.manual ? ant : casarPlano(l.planoTxt) != null ? { v: casarPlano(l.planoTxt), auto: true }
        : m != null && valido(m, 'p') ? { v: m, manual: true } : { v: '' };
      mapP[kp].txt = l.planoTxt;
    }
  }
  IMP.mapB = mapB; IMP.mapP = mapP;
}

async function impExistentes() {
  const datas = IMP.linhas.map(l => l.data).filter(Boolean).sort();
  IMP.exist = {}; IMP.carregando = true; desenharImp();
  if (datas.length) {
    try {
      const ex = await store.lancs({ ini: datas[0], fim: datas.at(-1), planilha_id: IMP.dest });
      for (const l of ex) { const k = impChave(l.data_lancamento, l.valor, l.item); IMP.exist[k] = (IMP.exist[k] || 0) + 1; }
    } catch (e) { toast(e.message, true); }

  IMP.carregando = false;
  if (IMP) desenharImp();
}
const impChave = (data, valor, item) => `${data}|${Number(valor).toFixed(2)}|${normTxt(item)}`;

// situação de cada linha: ok (pronta), dup (já existe), pend (falta escolher), skip (não importar), ign (inválida)
function impResolver() {
  const resto = { ...IMP.exist };
  return IMP.linhas.map(l => {
    const r = { l, banco_id: null, plano_id: null, st: 'ok', msg: '' };
    if (l.ign) return { ...r, st: 'ign', msg: l.ign };
    const mp = IMP.mapP[normTxt(l.planoTxt)];
    if (mp?.v === 'x') return { ...r, st: 'skip', msg: 'Não importar' };
    r.plano_id = mp?.v ? Number(mp.v) : null;
    const kb = normTxt(l.bancoTxt), mb = kb ? IMP.mapB[kb] : null;
    if (mb) r.banco_id = mb.v === '' || mb.v === 0 ? null : Number(mb.v);
    const k = impChave(l.data, l.valor, l.item);
    const dup = resto[k] > 0; if (dup) resto[k]--;
    if (!r.plano_id) { r.st = 'pend'; r.msg = 'Escolha a conta'; }
    else if (mb && mb.v === '') { r.st = 'pend'; r.msg = 'Escolha o banco'; }
    else if (dup) { r.st = 'dup'; r.msg = 'Já existe'; }
    r.pago = !!(l.pag && r.banco_id);
    r.sel = r.st === 'ok' || r.st === 'dup' ? (l.sel ?? r.st === 'ok') : false;
    return r;
  });
}

function impMapear(tipo, k, v) {
  if (!IMP) return;
  const map = tipo === 'b' ? IMP.mapB : IMP.mapP;
  const val = v === '' ? '' : v === 'x' ? 'x' : v === '0' ? 0 : Number(v);
  map[k] = { ...map[k], v: val, manual: val !== '', auto: false };

    const memo = impMemo();
    if (tipo === 'b') memo.banco[`${IMP.dest}|${k}`] = val; else memo.plano[k] = val;

}

async function impConfirmar() {
  if (!IMP || IMP.salvando) return;
  const R = impResolver().filter(r => r.sel);
  if (!R.length) return toast('Nenhuma linha marcada para importar.', true);
  const origem = `IMP:${Date.now().toString(36)}`;
  const rows = R.map(({ l, banco_id, plano_id, pago }) => ({
    planilha_id: IMP.dest, banco_id, plano_conta_id: plano_id,
    data_lancamento: l.data, item: l.item || M.plano[plano_id]?.nome || '', valor: l.valor,
    data_programada: l.prog || l.data, data_pagamento: pago ? l.pag : null, origem,
  }));
  IMP.salvando = true; desenharImp();
  let feitos = 0;
  try {
    for (let i = 0; i < rows.length; i += 500) { await store.insertMany('lancamentos', rows.slice(i, i + 500)); feitos += Math.min(500, rows.length - i); }
  } catch (e) {
    if (IMP) { IMP.salvando = false; desenharImp(); }
    return toast(feitos ? `Importados ${feitos} de ${rows.length}. Erro: ${e.message}` : e.message, true);
  }

  const ymAtual = `${S.ano}-${pad(S.mes + 1)}`;
  if (!meses[ymAtual]) { const [a, m] = Object.entries(meses).sort((x, y) => y[1] - x[1])[0][0].split('-').map(Number); S.ano = a; S.mes = m - 1; }
  const dest = IMP.dest;

  S.planilhaId = dest; S.editId = null;

  toast(`${rows.length} lançamento${rows.length === 1 ? '' : 's'} importado${rows.length === 1 ? '' : 's'} em ${siglaEmpresa(dest)}.`);
}

    const largo = card.classList.contains('s12') || !card.classList.contains('dcard');
    const maxH = retrato ? 85 : 62;
    let lw = largo ? W - 2 * ML : colW, ih = lw * img.h / img.w;
    if (ih > maxH) { lw = lw * maxH / ih; ih = maxH; }
    const bloco = ih + 12;
    if (largo && col === 1) { y += alturaLinha; col = 0; alturaLinha = 0; }
    if (y + bloco > H - BASE) { doc.addPage(); y = TOPO; col = 0; alturaLinha = 0; }
    const x = largo || col === 0 ? ML : ML + 6 + colW;
    txt(card.querySelector('.graf-t')?.childNodes[0]?.textContent, x, y + 3, { b: true });
    let lx = x + lw;
    [...card.querySelectorAll('.leg span')].reverse().forEach(sp => {
      const t = limparPDF(sp.textContent); doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
      lx -= doc.getTextWidth(t) + 6; const c = rgb(getComputedStyle(sp.querySelector('i')).backgroundColor);
      doc.setFillColor(...c.slice(0, 3)); doc.rect(lx, y + 0.8, 2.6, 2.6, 'F'); doc.setTextColor(100, 101, 107); doc.text(t, lx + 3.6, y + 3);
    });
    doc.addImage(img.url, 'PNG', x, y + 5, lw, ih);
    if (largo) y += bloco; else if (col === 0) { col = 1; alturaLinha = bloco; } else { y += Math.max(alturaLinha, bloco); col = 0; alturaLinha = 0; }
  }
  if (col === 1) y += alturaLinha;

  // ---- tabelas, cada uma com título de seção ----
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-30000px;top:0;width:1500px';
  $('main').appendChild(host);
  try {
    for (const sec of secoesPDF()) {
      const t = sec.el, box = document.createElement('div'); box.className = 'tabwrap'; box.appendChild(t); host.appendChild(box);
      if (sec.titulo) {
        if (y + 24 > H - BASE) { doc.addPage(); y = TOPO; }
        doc.setFillColor(...cor); doc.rect(ML, y + 0.2, 1.3, 4.2, 'F');
        txt(sec.titulo, ML + 3.5, y + 3.8, { b: true, s: 10.5 });
        y += 6.5;
        if (sec.nota) { txt(sec.nota, ML + 3.5, y + 2.6, { s: 8, c: [138, 21, 56] }); y += 5; }
      }
      const ncol = Math.max(...[...t.rows].map(r => [...r.cells].reduce((a, c) => a + (c.colSpan || 1), 0)), 1);
      const fs = retrato ? (ncol > 13 ? 4.6 : ncol > 9 ? 5.8 : 7.5) : (ncol > 15 ? 5.8 : ncol > 10 ? 6.8 : 8);
      const bfx = t.classList.contains('bfx-pdf');
      doc.autoTable({
        html: t, startY: y, theme: 'grid', showHead: 'everyPage', showFoot: 'lastPage',
        margin: { left: ML, right: ML, top: TOPO, bottom: BASE + 2 },
        styles: { fontSize: bfx ? (retrato ? 6.6 : 8.4) : fs, cellPadding: bfx ? { top: 1.6, bottom: 1.6, left: 1.4, right: 1.4 } : 1.15, overflow: 'linebreak', lineColor: [228, 228, 232], lineWidth: 0.1, textColor: [42, 43, 47], valign: 'middle' },
        headStyles: { fillColor: [62, 63, 68], textColor: 255, fontStyle: 'bold', halign: 'center', lineColor: [62, 63, 68] },
        footStyles: { fillColor: [233, 234, 237], textColor: [42, 43, 47], fontStyle: 'bold' },
        alternateRowStyles: bfx ? {} : { fillColor: [250, 250, 251] },
        didParseCell: d => {
          const el = d.cell.raw;
          if (!(el instanceof Element) || d.section === 'head') {
            if (bfx && d.section === 'head') { const k = d.column.index % 4; if (k === 1) d.cell.styles.textColor = [160, 230, 160]; if (k === 2) d.cell.styles.textColor = [255, 170, 160]; }
            return;
          }
          const cs = getComputedStyle(el), bg = rgb(cs.backgroundColor), fg = rgb(cs.color);
          if (bg && (bg[3] === undefined || bg[3] > 0) && !(bg[0] === 255 && bg[1] === 255 && bg[2] === 255)) d.cell.styles.fillColor = bg.slice(0, 3);
          if (fg) d.cell.styles.textColor = fg.slice(0, 3);
          const inner = el.querySelector('span.neg, span.pos, b.neg, b.pos');
          if (inner) d.cell.styles.textColor = rgb(getComputedStyle(inner).color).slice(0, 3);
          if (Number(cs.fontWeight) >= 600) d.cell.styles.fontStyle = 'bold';
          const tx = d.cell.text.join(' ').trim();
          if (/^[-+]?(R\$)?\s?[-\d.,%/()]+$/.test(tx)) d.cell.styles.minCellWidth = tx.length * d.cell.styles.fontSize * 0.19 + 2.4;
          if (cs.textAlign === 'right' || cs.textAlign === 'end') d.cell.styles.halign = 'right';
          else if (cs.textAlign === 'center') d.cell.styles.halign = 'center';
          if (bfx && d.column.index % 4 === 0) { d.cell.styles.halign = 'center'; d.cell.styles.fillColor = [241, 241, 243]; d.cell.styles.fontStyle = 'bold'; }
        },
      });
      y = doc.lastAutoTable.finalY + 8;
    }
  } finally { host.remove(); }

  // ---- cabeçalho e rodapé em todas as páginas ----
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    const lh = 15, lw = lh * logo.r;
    doc.addImage(logo.url, 'JPEG', ML, 7, lw, lh, 'logoCAP');
    doc.setDrawColor(226, 226, 230); doc.setLineWidth(0.3); doc.line(ML + lw + 4, 8, ML + lw + 4, 22);
    const tx = ML + lw + 8;
    txt(info.t, tx, 13.5, { b: true, s: 14 });
    txt([info.emp, info.per].filter(Boolean).join('   •   '), tx, 19.5, { s: 9, c: [100, 101, 107] });
    txt('RELATÓRIO GERENCIAL', W - ML, 11.5, { s: 6.5, b: true, c: [...cor], a: 'right' });
    txt(`Emitido em ${emitido}`, W - ML, 16, { s: 7.5, c: [116, 117, 123], a: 'right' });
    if (S.usuario) txt(`por ${nomeUsuario()}`, W - ML, 20, { s: 7.5, c: [116, 117, 123], a: 'right' });
    doc.setFillColor(...cor); doc.rect(ML, 25.5, W - 2 * ML, 1.1, 'F');
    doc.setFillColor(62, 63, 68); doc.rect(ML + (W - 2 * ML) * 0.82, 25.5, (W - 2 * ML) * 0.18, 1.1, 'F');
    doc.setDrawColor(221, 222, 226); doc.setLineWidth(0.2); doc.line(ML, H - 11, W - ML, H - 11);
    txt('C@P Consultoria  •  Sistema Financeiro', ML, H - 6.5, { s: 7.5, b: true, c: [88, 89, 94] });
    txt('Documento de uso interno', W / 2, H - 6.5, { s: 7, c: [150, 151, 156], a: 'center' });
    txt(`Página ${i} de ${n}`, W - ML, H - 6.5, { s: 7.5, c: [116, 117, 123], a: 'right' });
  }
  const slug = s => limparPDF(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/^_|_$/g, '');
  doc.save(`CAP_${slug(info.t)}_${slug(info.emp || '')}_${slug(info.per || '')}_${retrato ? 'retrato' : 'paisagem'}.pdf`.replace(/__+/g, '_'));
  toast('PDF gerado.');
}

async function salvarCadastro(t) {
  const cfg = t === 'grupos_dre' ? CAD_GDRE : CAD[t], row = {};
  for (const c of cfg.campos) {
    let v = $('c_' + c.k).value.trim();
    if (c.req && !v) return toast(`Preencha: ${c.l}.`, true), $('c_' + c.k).focus();
    if (c.t === 'money') { v = parseValor(v); if (Number.isNaN(v)) return toast(`Valor inválido em ${c.l}.`, true); }
    else if (c.t === 'int') v = parseInt(v, 10) || 0;
    else if (c.num) v = v === '' ? null : Number(v);
    else if (c.t === 'image') v = v || null;
    row[c.k] = v;
  }
  try {
    if (S.cadEdit) await store.update(t, S.cadEdit, row); else await store.insert(t, row);
    toast(S.cadEdit ? 'Alteração salva.' : 'Cadastrado com sucesso.');
    S.cadEdit = null;
    await recarregarCadastros(); renderCadastros();
    $('cadForm')?.querySelector('input,select')?.focus();
  } catch (e) { toast(e.message, true); }
}

async function excluirCadastro(t, id) {
  const r = S[t].find(x => x.id === id);
  const aviso = t === 'grupos_dre' ? '\nAs contas deste grupo ficarão sem grupo DRE.' : '';
  if (!r || !confirm(`Excluir "${r.nome}"?${aviso}`)) return;
  try { await store.remove(t, id); toast('Excluído.'); if (S.cadEdit === id) S.cadEdit = null; await recarregarCadastros(); renderCadastros(); }
  catch (e) { toast(e.message, true); }
}

function carregarImagem(file, k) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 96, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL('image/png');
      $('c_' + k).value = url;
      $('c_' + k + '_prev').innerHTML = iconeBanco({ logo: url }, 34);
    };
    img.onerror = () => toast('Não foi possível ler a imagem.', true);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

// Cadastro numa janela: escolhe o grupo, o código sequencial é sugerido e o grupo da DRE vem das outras contas do grupo.
let PCF = null;
const codValido = c => /^\d+(\.\d+)*$/.test(String(c ?? '').trim());
const prefixoCod = c => String(c).trim().split('.').slice(0, -1).join('.');
function proximoCodigo(gid, exceto = null) {
  const usados = new Set(S.plano_contas.filter(x => x.id !== exceto).map(x => String(x.codigo ?? '').trim()));
  const cods = S.plano_contas.filter(p => p.grupo_id === gid && p.id !== exceto).map(p => String(p.codigo ?? '').trim()).filter(codValido);
  let pre, n;
  if (cods.length) {
    const cont = {}; for (const c of cods) cont[prefixoCod(c)] = (cont[prefixoCod(c)] || 0) + 1;
    pre = Object.entries(cont).sort((a, b) => b[1] - a[1])[0][0];
    n = Math.max(...cods.filter(c => prefixoCod(c) === pre).map(c => Number(c.split('.').at(-1)) || 0)) + 1;
  } else {                       // grupo ainda sem contas: abre o próximo subgrupo (1.x receitas, 2.x despesas)
    const raiz = M.grupo[gid]?.tipo === 'RECEITA' ? '1' : '2';
    const subs = [...usados].filter(codValido).map(c => c.split('.')).filter(s => s[0] === raiz && s.length > 1).map(s => Number(s[1]) || 0);
    pre = `${raiz}.${(subs.length ? Math.max(...subs) : 0) + 1}`; n = 1;
  }
  const cod = k => pre ? `${pre}.${k}` : String(k);
  while (usados.has(cod(n))) n++;
  return cod(n);
}
function dreDoGrupo(gid, exceto = null) {
  const cont = {};
  for (const p of S.plano_contas) if (p.grupo_id === gid && p.id !== exceto && M.gdre[p.grupo_dre_id]) cont[p.grupo_dre_id] = (cont[p.grupo_dre_id] || 0) + 1;
  const m = Object.entries(cont).sort((a, b) => b[1] - a[1])[0];
  return m ? Number(m[0]) : null;
}

function pcGrupoMudou() {
  if (!PCF) return;

  if (gid) {
    const atual = cod.value.trim();

    if (PCF.id && gid === PCF.grupoOrig && atual === PCF.sug) { cod.value = PCF.codOrig; PCF.sug = null; }
    else if (trocar) { PCF.sug = proximoCodigo(gid, PCF.id); cod.value = PCF.sug; }

async function salvarConta() {

let bselAberto = null;

function prepararSeletoresBanco() {

function iconeOpcao(v, size) {

  if (b) return iconeBanco(b, size);

  return '';
}
const ICO_BANCOS = '<svg viewBox="0 0 24 24" width="62%" height="62%" aria-hidden="true"><path fill="currentColor" d="M12 2 2 7v2h20V7zM4 10v7h3v-7zm6.5 0v7h3v-7zM17 10v7h3v-7zM2 19v3h20v-3z"/></svg>';

    return;
  }
  if (e.key === 'Enter' && e.target.closest('tr.entrada, .lanc-form') && !e.target.matches('button')) {
    e.preventDefault();
    if (S.view === 'transferencias') salvarTransf(); else if (S.view === 'cartoes') ccLancar(); else salvarLanc();
  }
  if (e.key === 'Escape' && S.editId) { S.editId = null; renderLancamentos(); }
});

/* ============================== LOGIN ============================== */
// Usuário inicial: admin / cap_2026.
// No Supabase, "admin" vira o e-mail admin@cap.local (crie esse usuário em Authentication > Users).
// No modo demonstração a senha é conferida no navegador (sem segurança real: serve só para a demonstração).
const LOGIN_DOMINIO = 'gmail.com';   // login: capplanetaflores (ou o e-mail completo capplanetaflores@gmail.com)
const DEMO_USUARIO = 'admin';
const DEMO_SENHA_SHA256 = 'ec5b2902e8b2a8df186b0a3dd310a6dd0bd9ca0bde5c085da4c60cf7eb60afd1';
async function sha256(txt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const OLHO_ABERTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OLHO_FECHADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.6 9.6 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/></svg>';
// "Lembrar senha": guarda o usuário neste navegador, salva a senha no gerenciador de senhas do navegador e mantém o acesso ao reabrir.
const LEMBRAR_KEY = 'cap_lembrar', LEMBRAR_USER = 'cap_lembrar_user';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
function renderLogin(msg = '', usuario = '') {
  const lembrar = lsGet(LEMBRAR_KEY) === '1';
  if (!usuario && lembrar) usuario = lsGet(LEMBRAR_USER) || '';
  const folha = '<svg viewBox="0 0 40 16" width="34" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12C14 11 26 8 36 3"/><path d="M12 10.6c-1-3 1-5.5 3.5-6.2.6 2.8-.9 5.3-3.5 6.2z"/><path d="M20 8.6c-.6-3 1.6-5.2 4.2-5.6.3 2.8-1.5 5-4.2 5.6z"/><path d="M15 11c2.2 1.6 5 1.8 7 .4-2-1.8-4.8-1.9-7-.4z"/><path d="M24 8c2.3 1.3 5 1.2 6.8-.3-2.1-1.6-4.8-1.4-6.8.3z"/></svg>';
  $('app').innerHTML = `
    <div class="login pf" style="--capa:url('${PF.capa}')">
     <div class="lg-card">
      <div class="lg-capa" role="img" aria-label="Planeta Flores em parceria com a C@P Consultoria">
        <div class="lg-capa-in">
          <div class="lg-orn"><i></i>${folha}<i></i></div>
          <small class="lg-kick">Sistema</small>
          <b class="lg-tt">Financeiro</b>
          <div class="lg-orn"><i></i>${folha}<i></i></div>
          <img class="lg-pf" src="${PF.logo}" alt="Planeta Flores">
          <div class="lg-x"><i></i><span>em parceria com</span><i></i></div>
          <img class="lg-cap" src="${BRAND.logoG}" alt="C@P Consultoria">
        </div>
      </div>
      <form id="loginForm" autocomplete="on">
        <div class="lg-mob"><img src="${PF.logo}" alt="Planeta Flores"><span></span><img src="${BRAND.logoG}" alt="C@P Consultoria"></div>
        <div class="lg-tit"><small>Planeta Flores · Sistema Financeiro</small><b>Acesse sua conta</b><p>Entre com seu usuário e senha.</p></div>
        <label>Usuário<input id="l_user" value="${esc(usuario)}" placeholder="capplanetaflores" required autocomplete="username" autocapitalize="off"></label>
        <label>Senha<span class="senha"><input type="password" id="l_senha" placeholder="••••••••" required autocomplete="current-password"><button type="button" class="ver" id="l_ver" title="Mostrar senha" aria-label="Mostrar senha" aria-pressed="false">${OLHO_ABERTO}</button></span></label>
        <label class="lembrar"><input type="checkbox" id="l_lembrar" ${lembrar ? 'checked' : ''}> Lembrar senha</label>
        <div class="erro">${esc(msg)}</div>
        <button class="btn" type="submit" id="l_ok">Entrar</button>
        <div class="login-rod">Planeta Flores · C@P Consultoria · ${MODO_SUPABASE ? 'acesso seguro' : 'modo demonstração'}</div>
      </form>
     </div>
    </div>`;
  (usuario ? $('l_senha') : $('l_user')).focus();
  const ver = $('l_ver');
  ver.addEventListener('mousedown', e => e.preventDefault());     // não tira o foco do campo
  ver.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const i = $('l_senha'), mostrar = i.type === 'password';
    i.type = mostrar ? 'text' : 'password';
    ver.innerHTML = mostrar ? OLHO_FECHADO : OLHO_ABERTO;
    ver.title = mostrar ? 'Ocultar senha' : 'Mostrar senha'; ver.setAttribute('aria-label', ver.title); ver.setAttribute('aria-pressed', String(mostrar));
    i.focus(); const n = i.value.length; try { i.setSelectionRange(n, n); } catch (err) {}
  });
  // preenche a senha guardada no navegador (Chrome/Edge), se houver
  if (lembrar && window.PasswordCredential && navigator.credentials?.get && !$('l_senha').value)
    navigator.credentials.get({ password: true, mediation: 'optional' }).then(c => {
      if (c && c.password && $('l_senha') && !$('l_senha').value) { if (c.id) $('l_user').value = c.id; $('l_senha').value = c.password; }
    }).catch(() => {});
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const user = $('l_user').value.trim().toLowerCase(), senha = $('l_senha').value;
    $('l_ok').disabled = true; $('l_ok').textContent = 'Entrando…';
    if (MODO_SUPABASE) {
      const email = user.includes('@') ? user : `${user}@${LOGIN_DOMINIO}`;
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        const m = error.message || '';
        return renderLogin(/invalid login/i.test(m) ? `Usuário ou senha inválidos (${email} no projeto ${SUPABASE_URL.replace(/^https:\/\/|\.supabase\.co.*$/g, '')}).`
          : /not confirmed/i.test(m) ? 'Usuário ainda não confirmado. No Supabase, confirme o usuário (Auto Confirm User).'
          : /fetch|network/i.test(m) ? 'Sem conexão com o Supabase. Verifique a internet.' : 'Não foi possível entrar: ' + m, user);
      }
      S.usuario = user.split('@')[0];
    } else {
      let ok = false;
      try { ok = user === DEMO_USUARIO && await sha256(senha) === DEMO_SENHA_SHA256; } catch (err) { ok = false; }
      if (!ok) return renderLogin('Usuário ou senha inválidos.', user);
      S.usuario = user;
      try { sessionStorage.setItem('cap_sessao', user); } catch (err) {}
    }
    const lembrarOk = $('l_lembrar').checked;
    lsSet(LEMBRAR_KEY, lembrarOk ? '1' : '0'); lsSet(LEMBRAR_USER, lembrarOk ? $('l_user').value.trim() : null);
    try { sessionStorage.setItem('cap_ativo', '1'); } catch (err) {}
    if (lembrarOk && window.PasswordCredential && navigator.credentials?.store)
      try { await navigator.credentials.store(new PasswordCredential({ id: $('l_user').value.trim(), password: senha, name: $('l_user').value.trim() })); } catch (err) {}
    if (!MODO_SUPABASE && lembrarOk) lsSet('cap_sessao_lembrada', S.usuario); else lsSet('cap_sessao_lembrada', null);
    iniciarApp();
  });
}

/* ============================== INÍCIO ============================== */
async function iniciarApp() {
  renderShell();
  try { await recarregarCadastros(); } catch (e) { toast(e.message, true); }
  await carregarCheques();
  await renovarCustosFixos();
  await irPara('dash');
  await mostrarPendencias();
}

async function boot() {
  if (MODO_SUPABASE) {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    store = new SupaStore(sb);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return renderLogin();
    let ativo = null; try { ativo = sessionStorage.getItem('cap_ativo'); } catch (e) {}
    if (lsGet(LEMBRAR_KEY) !== '1' && !ativo) { await sb.auth.signOut(); return renderLogin(); }
    S.usuario = (session.user?.email || '').split('@')[0];
  } else {
    store = new LocalStore();
    let sessao = null;
    try { sessao = sessionStorage.getItem('cap_sessao'); } catch (e) {}
    if (!sessao && lsGet(LEMBRAR_KEY) === '1') sessao = lsGet('cap_sessao_lembrada');
    if (!sessao) return renderLogin();
    S.usuario = sessao;
  }
  iniciarApp();
}
boot();
</script>
